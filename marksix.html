<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>香港六合彩 分析</title>
<style>
:root {
  --bg: #f0f4f8;
  --card: #ffffff;
  --primary: #16a34a;
  --primary-dk: #15803d;
  --text: #1e293b;
  --muted: #64748b;
  --border: #e2e8f0;
  --z1: #2563eb; --z1-bg: #dbeafe;
  --z2: #16a34a; --z2-bg: #dcfce7;
  --z3: #ea580c; --z3-bg: #ffedd5;
  --z4: #dc2626; --z4-bg: #fee2e2;
  --od: #9333ea; --od-bg: #f3e8ff;
  --warn: #d97706; --warn-bg: #fef3c7;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* Header */
header { background: var(--primary); color: #fff; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
header h1 { font-size: 1.1rem; font-weight: 700; }
#hdr-info { font-size: .78rem; opacity: .85; text-align: right; line-height: 1.5; }

/* Input */
.input-card { background: var(--card); margin: 12px; border-radius: 12px; padding: 14px 16px; box-shadow: 0 1px 4px rgba(0,0,0,.07); }
.input-card h2 { font-size: .82rem; font-weight: 600; color: var(--muted); margin-bottom: 10px; }
.input-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
input[type=number] { border: 1.5px solid var(--border); border-radius: 8px; padding: 8px 6px; font-size: .95rem; text-align: center; width: 60px; outline: none; -moz-appearance: textfield; }
input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
input[type=number]:focus { border-color: var(--primary); }
#inp-period { width: 80px; }
.num-wrap { display: flex; gap: 5px; }
.btn { background: var(--primary); color: #fff; border: none; border-radius: 8px; padding: 9px 16px; font-size: .88rem; font-weight: 600; cursor: pointer; white-space: nowrap; transition: background .15s; }
.btn:hover { background: var(--primary-dk); }
.btn-gray { background: #94a3b8; }
.btn-gray:hover { background: #64748b; }
.btn-red { background: #dc2626; }
.btn-red:hover { background: #b91c1c; }

/* Tabs */
.tabs { display: flex; background: var(--card); border-bottom: 1px solid var(--border); overflow-x: auto; padding: 0 12px; }
.tab-btn { border: none; background: none; padding: 11px 14px; font-size: .83rem; font-weight: 500; color: var(--muted); cursor: pointer; border-bottom: 2.5px solid transparent; white-space: nowrap; transition: all .15s; }
.tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 700; }

/* Content */
#content { padding: 12px; max-width: 760px; margin: 0 auto; }

/* Card */
.card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
.card h3 { font-size: .93rem; font-weight: 700; margin-bottom: 12px; }
.sec-lbl { font-size: .72rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }

/* Balls */
.ball { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%; font-size: .82rem; font-weight: 700; margin: 2px; flex-shrink: 0; }
.ball-sm { width: 26px; height: 26px; font-size: .72rem; margin: 1px; }
.z1 { background: var(--z1-bg); color: var(--z1); }
.z2 { background: var(--z2-bg); color: var(--z2); }
.z3 { background: var(--z3-bg); color: var(--z3); }
.z4 { background: var(--z4-bg); color: var(--z4); }
.zx { background: #f1f5f9; color: #94a3b8; }

/* Tags */
.tag { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 20px; font-size: .72rem; font-weight: 600; }
.tag-hot { background: #fee2e2; color: #dc2626; }
.tag-cold { background: #dbeafe; color: #2563eb; }
.tag-od { background: var(--od-bg); color: var(--od); }
.tag-warn { background: var(--warn-bg); color: var(--warn); }
.tag-ok { background: #dcfce7; color: #16a34a; }
.tag-gray { background: #f1f5f9; color: var(--muted); }

/* Tables */
table { width: 100%; border-collapse: collapse; font-size: .83rem; }
th { text-align: left; padding: 7px 8px; color: var(--muted); font-weight: 600; border-bottom: 1.5px solid var(--border); font-size: .75rem; }
td { padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: none; }

/* Alerts */
.alert { border-radius: 8px; padding: 10px 12px; font-size: .83rem; margin-bottom: 8px; line-height: 1.6; }
.alert-danger { background: #fee2e2; color: #991b1b; }
.alert-warn { background: var(--warn-bg); color: #92400e; }
.alert-od { background: var(--od-bg); color: #6b21a8; }
.alert-ok { background: #dcfce7; color: #166534; }
.alert-blue { background: #dbeafe; color: #1e40af; }

/* Group cards */
.grp { border: 1.5px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 10px; }
.grp-title { font-size: .9rem; font-weight: 700; margin-bottom: 10px; }
.grp-nums { display: flex; gap: 2px; flex-wrap: wrap; margin-bottom: 8px; }
.grp-meta { font-size: .79rem; color: var(--muted); line-height: 1.7; }
.verify-row { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }

/* Stats */
.zone-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
.zone-box { border-radius: 8px; padding: 10px 8px; text-align: center; }
.zone-box .val { font-size: 1.4rem; font-weight: 700; }
.zone-box .lbl { font-size: .7rem; color: var(--muted); margin-top: 2px; }

/* Tail grid */
.tail-grid { display: grid; grid-template-columns: repeat(5,1fr); gap: 6px; }
.tail-cell { border-radius: 8px; padding: 8px 4px; text-align: center; background: var(--bg); }
.tail-cell .tv { font-size: 1.1rem; font-weight: 700; }
.tail-cell .tl { font-size: .68rem; color: var(--muted); margin-top: 2px; }
.bar-wrap { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 5px; }
.bar-fill { height: 100%; border-radius: 3px; }

/* Num row */
.num-row { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border); }
.num-row:last-child { border-bottom: none; }

/* OD bar */
.od-bar { flex: 1; }
.od-label { min-width: 44px; text-align: right; font-size: .8rem; font-weight: 700; }

/* Empty */
.empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: .88rem; }

/* Settings textarea */
textarea { width: 100%; height: 180px; font-family: monospace; font-size: .78rem; border: 1.5px solid var(--border); border-radius: 8px; padding: 10px; resize: vertical; outline: none; }
textarea:focus { border-color: var(--primary); }

@media (max-width: 480px) {
  .zone-grid { grid-template-columns: repeat(2,1fr); }
  .input-row { flex-direction: column; align-items: flex-start; }
}
</style>
</head>
<body>

<header>
  <h1>🔴 香港六合彩 分析</h1>
  <div id="hdr-info">載入中…</div>
</header>

<div class="input-card">
  <h2>＋ 輸入最新開獎號碼</h2>
  <div class="input-row">
    <input id="inp-period" type="number" placeholder="期號" />
    <div class="num-wrap">
      <input class="ni" type="number" min="1" max="49" placeholder="01" />
      <input class="ni" type="number" min="1" max="49" placeholder="02" />
      <input class="ni" type="number" min="1" max="49" placeholder="03" />
      <input class="ni" type="number" min="1" max="49" placeholder="04" />
      <input class="ni" type="number" min="1" max="49" placeholder="05" />
      <input class="ni" type="number" min="1" max="49" placeholder="06" />
      <input class="ni" type="number" min="1" max="49" placeholder="特別" id="inp-extra" />
    </div>
    <button class="btn" onclick="addDraw()">送出 → 快報</button>
  </div>
</div>

<nav class="tabs">
  <button class="tab-btn" onclick="go('report')">📋 快報</button>
  <button class="tab-btn active" onclick="go('pick')">🎯 選號</button>
  <button class="tab-btn" onclick="go('annual')">📈 年度規律</button>
  <button class="tab-btn" onclick="go('stats')">📊 統計</button>
  <button class="tab-btn" onclick="go('records')">📜 紀錄</button>
  <button class="tab-btn" onclick="go('settings')">⚙️ 設定</button>
  <button class="tab-btn" onclick="go('track')">🏆 中獎追蹤</button>
  <button class="tab-btn" onclick="go('companion')">🤝 同伴</button>
</nav>

<main id="content"></main>

<script>document.write('<script src="data_m6.js?v=' + Date.now() + '"><\/script>');</script>
<script>
// ── CONSTANTS ──────────────────────────────────────────────
const Z = n => n<=12?1:n<=24?2:n<=36?3:4;
const ZN = ['','一區 01-12','二區 13-24','三區 25-36','四區 37-49'];
const ZL = ['','一區','二區','三區','四區'];
const ZC = ['','z1','z2','z3','z4'];
const f2 = n => String(n).padStart(2,'0');


// ── STORAGE ────────────────────────────────────────────────
let rec = [], st = {}, retHist = {}, conStat = {}, ANNUAL = null;
let pendingPick = null;  // {strategies:{G1:[...], ...}, ts: timestamp}
let pickLog = [];        // [{period, strategies, result, hits, ts}]
let compNum = 8;         // 同伴分析選中的號碼
// retHist[num] = [{period, gap}, ...]
// conStat[num] = {total, repeats, followedBy:{m:count,...}}
//   total      = times num appeared as "previous draw" predecessor
//   repeats    = times num also appeared in the very next draw (連莊)
//   followedBy = for each number m, how many times m appeared in the next draw after num

function buildRetHistFromRec(records, maxN) {
  const rh = {};
  const ordered = [...records].reverse();
  const firstSeen = new Set();
  const absence = new Array(maxN+1).fill(0);
  for (const r of ordered) {
    for (let n=1; n<=maxN; n++) {
      if (r.n.includes(n)) {
        if (firstSeen.has(n)) {
          if (!rh[n]) rh[n] = [];
          rh[n].push({period: r.p, gap: absence[n]});
        }
        firstSeen.add(n);
        absence[n] = 0;
      } else if (firstSeen.has(n)) {
        absence[n]++;
      }
    }
  }
  return rh;
}

function buildConStat(records) {
  const s = {};
  const ordered = [...records].reverse(); // chronological
  for (let i = 0; i < ordered.length - 1; i++) {
    const prev = ordered[i].n, curr = ordered[i+1].n;
    prev.forEach(n => {
      if (!s[n]) s[n] = {total:0, repeats:0, followedBy:{}};
      s[n].total++;
      if (curr.includes(n)) s[n].repeats++;
      curr.forEach(m => { s[n].followedBy[m] = (s[n].followedBy[m]||0)+1; });
    });
  }
  return s;
}

function buildPairStat() {
  const pairs = {};
  rec.forEach(r => {
    const sorted = [...r.n].sort((a,b)=>a-b);
    for(let i=0;i<sorted.length-1;i++)
      for(let j=i+1;j<sorted.length;j++) {
        const k = `${sorted[i]}-${sorted[j]}`;
        pairs[k] = (pairs[k]||0)+1;
      }
  });
  return pairs;
}

function reconstructLastReport() {
  if (!rec[0]) return;
  const sorted = rec[0].n;
  const pv = rec[0].p;
  const drawn = sorted.map(n => {
    let abBefore = 0;
    for (let i = 1; i < rec.length; i++) {
      if (rec[i].n.includes(n)) { abBefore = i - 1; break; }
      abBefore = i;
    }
    return {n, abBefore, ratio: +(abBefore / (st[n]?.ag || 1)).toFixed(2)};
  });
  const zd = {1:0,2:0,3:0,4:0};
  sorted.forEach(n => {zd[Z(n)]++;});
  const repeatNums = rec[1] ? sorted.filter(n => rec[1].n.includes(n)) : [];
  lastReport = {period:pv, nums:sorted, drawn, zoneDist:zd, repeatNums};
}

// localStorage 在 iOS file:// 下可能被封鎖，統一包 try/catch
function lsGet(k) { try { return localStorage.getItem(k); } catch(e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch(e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch(e) {} }

function load() {
  const r = lsGet('m6r');
  const s = lsGet('m6s');
  const h = lsGet('m6h');
  const storedRec = r ? JSON.parse(r) : null;
  // Auto-upgrade: if stored data is behind BASE_REC, reset to BASE_REC
  if (!storedRec || storedRec[0]?.p < BASE_REC[0].p) {
    rec     = JSON.parse(JSON.stringify(BASE_REC));
    st      = JSON.parse(JSON.stringify(BASE_ST));
    retHist = buildRetHistFromRec(rec, 49);
    conStat = buildConStat(rec);
    save();
  } else {
    rec     = storedRec;
    st      = s ? JSON.parse(s) : JSON.parse(JSON.stringify(BASE_ST));
    const parsedH = h ? JSON.parse(h) : null;
    retHist = (parsedH && Object.keys(parsedH).length > 0) ? parsedH : buildRetHistFromRec(rec, 49);
    conStat = buildConStat(rec);
  }
  ANNUAL = buildAnnual(rec);
  loadPickLog();
  reconstructLastReport();
}
function save() {
  lsSet('m6r', JSON.stringify(rec));
  lsSet('m6s', JSON.stringify(st));
  lsSet('m6h', JSON.stringify(retHist));
}
function loadPickLog() {
  lsDel('m6pp');  // 手動鎖定已廢除（2026-08-09 減法重構）：pending 一律來自 Python 事前發布
  const l = lsGet('m6pl');
  pendingPick = BASE_PENDING ? JSON.parse(JSON.stringify(BASE_PENDING)) : null;
  // pickLog：BASE_PICKLOG 為基底，localStorage 追加未同步的紀錄
  const base = BASE_PICKLOG ? JSON.parse(JSON.stringify(BASE_PICKLOG)) : [];
  const local = l ? JSON.parse(l) : [];
  const basePeriods = new Set(base.map(e=>e.period));
  const extra = local.filter(e=>!basePeriods.has(e.period));
  pickLog = [...extra, ...base];
}
function savePickLog() {
  // pendingPick 不再持久化（一律來自 BASE_PENDING；2026-08-09）
  // 只存 BASE_PICKLOG 沒有的本地紀錄
  const basePeriods = new Set(BASE_PICKLOG.map(e=>e.period));
  lsSet('m6pl', JSON.stringify(pickLog.filter(e=>!basePeriods.has(e.period))));
}
// ── CORE ANALYSIS ──────────────────────────────────────────
const od   = n => st[n] ? +(st[n].ab / st[n].ag).toFixed(2) : 0;
const sat  = n => st[n] ? +((st[n].ab / st[n].mg)*100).toFixed(1) : 0;
const excl = n => st[n] ? st[n].ab >= st[n].mg : true;

function candidates() { return Array.from({length:49},(_,i)=>i+1).filter(n=>!excl(n)); }
function excluded()   { return Array.from({length:49},(_,i)=>i+1).filter(n=>excl(n)); }

function zoneCounts(sliceN=10) {
  const c={1:0,2:0,3:0,4:0};
  rec.slice(0,sliceN).forEach(r=>r.n.forEach(n=>{c[Z(n)]++;}));
  return c;
}

function hotCold(zc) {
  const maxODinZone = z => {
    const pool = candidates().filter(n=>Z(n)===z);
    return pool.length ? Math.max(...pool.map(od)) : 0;
  };
  const sorted = [1,2,3,4].sort((a,b)=>{
    if (zc[b]!==zc[a]) return zc[b]-zc[a];
    return maxODinZone(b)-maxODinZone(a);
  });
  return {hot:sorted[0], cold:sorted[3]};
}

function tailCounts(n=10) {
  const c={};
  for(let i=0;i<=9;i++) c[i]=0;
  rec.slice(0,n).forEach(r=>r.n.forEach(num=>{c[num%10]++;}));
  return c;
}

function buildReturnDist(records) {
  const dist = {};
  for(let i=records.length-1; i>=0; i--) {
    for(const n of records[i].n) {
      for(let j=i-1; j>=0; j--) {
        if(records[j].n.includes(n)) {
          const gap = i - j - 1;
          dist[gap] = (dist[gap] || 0) + 1;
          break;
        }
      }
    }
  }
  return dist;
}

// 保留舊的 cs/byCS 供 G4 警告標注用（不再影響選號）
function cs(n) {
  if(!st[n]) return 0; const s=st[n];
  return (s.ab/s.ag)*0.6 + (s.ab/s.mg)*3*0.4;
}
const byCS = arr => [...arr].sort((a,b)=>cs(b)-cs(a));



// 雙信號合成預測：S3年度熱度(60%) + S4近期動能(40%)
// 回測驗證：逾期壓力~1.09×（無效）已完全剔除；動能×年度雙信號達1.66×隨機


// ── UI HELPERS ─────────────────────────────────────────────
const ball  = (n,sm='') => `<span class="ball ${sm} ${ZC[Z(n)]}">${f2(n)}</span>`;
const ballX = (n,sm='') => `<span class="ball ${sm} zx">${f2(n)}</span>`;

function odTag(n){
  const r=od(n);
  if(r>=2.0) return `<span class="tag tag-od">×${r}倍</span>`;
  if(r>=1.0) return `<span class="tag tag-warn">×${r}倍</span>`;
  return `<span class="tag tag-gray">×${r}倍</span>`;
}

function ck(ok,label){
  return `<span class="tag ${ok?'tag-ok':'tag-hot'}">${ok?'✅':'❌'} ${label}</span>`;
}

// ── TABS ───────────────────────────────────────────────────
let tab='pick', lastReport=null, rptMode=0, rptHistFilter='', selectedRptIdx=0;

// ── SORT HELPERS ───────────────────────────────────────────
const sortState = {};
function setSort(tid, col) {
  const s = sortState[tid];
  sortState[tid] = (s && s.col === col)
    ? {col, dir: s.dir === 'asc' ? 'desc' : 'asc'}
    : {col, dir: 'desc'};
}
function thSort(tid, col, label) {
  const s = sortState[tid];
  const active = s && s.col === col;
  const arr = active ? (s.dir === 'asc' ? '▲' : '▼') : '↕';
  return `<th onclick="setSort('${tid}','${col}');render()" style="cursor:pointer;user-select:none;white-space:nowrap">${label} <span style="font-size:.65em;color:${active?'#4ade80':'#64748b'}">${arr}</span></th>`;
}
function applySort(arr, tid, defCol, defDir) {
  const s = sortState[tid] || (defCol ? {col:defCol, dir:defDir||'desc'} : null);
  if (!s) return arr;
  return [...arr].sort((a, b) => {
    const va = a[s.col], vb = b[s.col];
    const cmp = typeof va === 'string' ? va.localeCompare(vb, 'zh-TW') : (va??0) - (vb??0);
    return s.dir === 'asc' ? cmp : -cmp;
  });
}

function go(t){
  tab=t;
  document.querySelectorAll('.tab-btn').forEach((b,i)=>{
    b.classList.toggle('active',['report','pick','annual','stats','records','settings','track','companion'][i]===t);
  });
  render();
}

function render(){
  const el=document.getElementById('content');
  if(tab==='report')   renderReport(el);
  else if(tab==='pick') renderPick(el);
  else if(tab==='annual') renderAnnual(el);
  else if(tab==='stats') renderStats(el);
  else if(tab==='records') renderRecords(el);
  else if(tab==='track') renderTrack(el);
  else if(tab==='companion') renderCompanion(el);
  else renderSettings(el);
}

// ── RENDER: REPORT ─────────────────────────────────────────

// 回算第 i 期抽獎前，號碼 n 的沉寂期數
function dormancyBefore(i, n) {
  for(let j=i+1; j<rec.length; j++) {
    if(rec[j].n.includes(n)) return j-i-1;
  }
  return rec.length-i-1;
}

function toggleRptDetail(id) {
  const el=document.getElementById(id);
  if(el) el.style.display = el.style.display==='none'?'table-row':'none';
}

function buildReportForIdx(idx) {
  const r = rec[idx];
  if (!r) return null;
  const sorted = [...r.n].sort((a,b)=>a-b);
  const drawn = sorted.map(n => {
    const abBefore = dormancyBefore(idx, n);
    const ratio = +(abBefore / (st[n]?.ag || 8)).toFixed(2);
    return {n, abBefore, ratio};
  });
  const zd = {1:0,2:0,3:0,4:0};
  sorted.forEach(n => zd[Z(n)]++);
  const repeatNums = rec[idx+1] ? sorted.filter(n => rec[idx+1].n.includes(n)) : [];
  return {period: r.p, nums: sorted, drawn, zoneDist: zd, repeatNums, idx};
}
function showRptDetail(idx) { selectedRptIdx=idx; rptMode=2; render(); }

function renderReportHistory(el) {
  const q = rptHistFilter.trim();
  const qNum = parseInt(q);
  const filterByNum = !isNaN(qNum) && qNum>=1 && qNum<=49;
  const filterByPeriod = q.length>=4 && !filterByNum;

  const allPeriods = rec.map((r,i) => {
    const zd={1:0,2:0,3:0,4:0};
    r.n.forEach(n=>zd[Z(n)]++);
    const details = r.n.map(n => {
      const d = dormancyBefore(i,n);
      const ag = st[n]?.ag||8;
      const ratio = +(d/ag).toFixed(2);
      return {n, d, ratio};
    });
    const superOD = details.filter(x=>x.ratio>=2.0);
    const overdue  = details.filter(x=>x.ratio>=1.0&&x.ratio<2.0);
    return {p:r.p, nums:r.n, zd, details, superOD, overdue, i};
  });

  const periods = allPeriods.filter(p => {
    if(filterByNum)    return p.nums.includes(qNum);
    if(filterByPeriod) return String(p.p).includes(q);
    return true;
  });

  const zoneColor = ['','#2563eb','#16a34a','#ea580c','#dc2626'];

function renderReport(el){
  const modeBar = `<div style="display:flex;gap:0;margin-bottom:12px;background:#f1f5f9;border-radius:10px;padding:3px">
    <button onclick="rptMode=0;render()" style="flex:1;border:none;border-radius:8px;padding:8px 12px;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .15s;${rptMode===0?'background:#fff;color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.12)':'background:none;color:var(--muted)'}">📋 本期快報</button>
    <button onclick="rptMode=1;render()" style="flex:1;border:none;border-radius:8px;padding:8px 12px;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .15s;${rptMode===1?'background:#fff;color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.12)':'background:none;color:var(--muted)'}">📚 歷史查詢 (${rec.length}期)</button>
  </div>`;

  if(rptMode===1){
    el.innerHTML = modeBar;
    renderReportHistory(el);
    return;
  }

  if(rptMode===2){
    renderHistReport(el);
    return;
  }

  if(!lastReport){ el.innerHTML=modeBar+`<div class="empty">尚無快報。<br>請輸入最新開獎號碼後按「送出」。</div>`; return; }
  const R=lastReport;

  function note(d){
    if(d.abBefore===0) return '連莊';
    if(d.ratio>=2.0) return '⭐ 超期回歸';
    if(d.ratio>=1.0) return '逾期回歸';
    return '正常回歸';
  }

  // warnings post-update
  const w9=[], w78=[], superODs=[];
  for(let n=1;n<=49;n++){
    if(!st[n]||R.nums.includes(n)||excl(n)) continue;
    if(st[n].ab===9) w9.push(n);
    else if(st[n].ab===7||st[n].ab===8) w78.push(n);
    if(od(n)>=2.0) superODs.push(n);
  }
  superODs.sort((a,b)=>od(b)-od(a));

  const zd=R.zoneDist;

  el.innerHTML=modeBar+`
  <div class="card">
    <h3>📋 第 ${R.period} 期 快報</h3>
    <div class="sec-lbl">本期開出號碼</div>
    <div style="display:flex;gap:2px;flex-wrap:wrap;margin-bottom:12px">${R.nums.map(n=>ball(n)).join('')}</div>
    <table>
      <thead><tr>${thSort('rpt-drawn','n','號碼')}${thSort('rpt-drawn','abBefore','沉寂期數')}${thSort('rpt-drawn','ratio','逾期倍數')}<th>區間</th><th>備註</th></tr></thead>
      <tbody>${applySort(R.drawn,'rpt-drawn','n','asc').map(d=>`<tr>
        <td>${ball(d.n,'ball-sm')}</td>
        <td>${d.abBefore===0?'連莊':d.abBefore+'期後回歸'}</td>
        <td>${odTag(d.n)}</td>
        <td><span class="tag tag-gray">${ZL[Z(d.n)]}</span></td>
        <td style="font-size:.78rem">${note(d)}</td>
      </tr>`).join('')}</tbody>
    </table>
  </div>

  <div class="card">
    <h3>📊 本期區間分佈</h3>
    <div class="zone-grid">
      ${[1,2,3,4].map(z=>`<div class="zone-box" style="background:var(--z${z}-bg)">
        <div class="val" style="color:var(--z${z})">${zd[z]}</div>
        <div class="lbl">${ZL[z]}</div>
      </div>`).join('')}
    </div>
  </div>

  <div class="card">
    <h3>🔁 本期回歸號碼 — 歷史沉寂統計</h3>
    <table>
      <thead><tr>${thSort('rpt-ret','n','號碼')}${thSort('rpt-ret','abBefore','本次沉寂')}${thSort('rpt-ret','cnt','回歸次數')}${thSort('rpt-ret','avg','平均沉寂期')}${thSort('rpt-ret','min','最短')}${thSort('rpt-ret','max','最長')}</tr></thead>
      <tbody>${applySort(R.drawn.map(d=>{
        const h=retHist[d.n]; const allGaps=h?h.map(x=>x.gap):[]; const cnt=allGaps.length;
        const avg=cnt?(allGaps.reduce((a,b)=>a+b,0)/cnt):null;
        return {n:d.n,abBefore:d.abBefore,cnt,avg:avg?+avg.toFixed(1):null,min:cnt?Math.min(...allGaps):null,max:cnt?Math.max(...allGaps):null};
      }),'rpt-ret','n','asc').map(({n,abBefore,cnt,avg,min,max})=>{
        if(!cnt) return `<tr><td>${ball(n,'ball-sm')}</td><td>${abBefore}期</td><td colspan="4" style="color:var(--muted);font-size:.78rem">紀錄累積中</td></tr>`;
        return `<tr>
          <td>${ball(n,'ball-sm')}</td>
          <td style="font-weight:600">${abBefore}期</td>
          <td style="text-align:center">${cnt}次</td>

  <div class="card">
    <h3>⚠️ 沉寂號追蹤更新</h3>
    ${w9.length?`<div class="alert alert-danger">🆕 <strong>最高警戒（9期）</strong>：下期再未開即進入排除<br>${w9.map(n=>ball(n,'ball-sm')).join('')}</div>`:''}
    ${w78.length?`<div class="alert alert-warn">⚠️ <strong>持續觀察（7–8期）</strong>：${w78.map(n=>`${ball(n,'ball-sm')}<small style="font-size:.7rem"> ${st[n].ab}期</small>`).join(' ')}</div>`:''}
    ${superODs.length?`<div class="alert alert-od">⭐ <strong>超期候選號（逾期 ≥2.0倍）</strong>：<br>${superODs.map(n=>`${ball(n,'ball-sm')}<small style="font-size:.7rem"> ×${od(n)}</small>`).join(' ')}</div>`:''}
    ${!w9.length&&!w78.length&&!superODs.length?'<div style="font-size:.83rem;color:var(--muted)">本期無特殊警戒號碼</div>':''}
  </div>

  <div class="card">
    <h3>🔗 連莊分析</h3>
    ${(R.repeatNums&&R.repeatNums.length>0)
      ? `<div class="alert alert-ok" style="margin-bottom:10px">✅ 本期連莊號碼（與上期重複）：${R.repeatNums.map(n=>ball(n,'ball-sm')).join('')}</div>`
      : `<div class="alert alert-blue" style="margin-bottom:10px">本期無連莊號碼</div>`}
    <div class="sec-lbl">下期連莊預警 — 本期6碼歷史連莊傾向</div>
    <table>
      <thead><tr><th>號碼</th><th>歷史出現</th><th>連莊次數</th><th>連莊率</th><th>最常伴隨下一期出現</th></tr></thead>
      <tbody>${R.nums.map(n=>{
        const cs=conStat[n];
        if(!cs||cs.total===0) return `<tr><td>${ball(n,'ball-sm')}</td><td colspan="4" style="color:var(--muted);font-size:.78rem">累積中</td></tr>`;
        const rate=+(cs.repeats/cs.total*100).toFixed(0);
        const rateClr=rate>=20?'#dc2626':rate>=13?'var(--warn)':'var(--muted)';
        const topF=Object.entries(cs.followedBy).sort((a,b)=>b[1]-a[1]).slice(0,3);
        return `<tr>
          <td>${ball(n,'ball-sm')}</td>
          <td style="text-align:center">${cs.total}</td>
          <td style="text-align:center">${cs.repeats}</td>
          <td style="text-align:center;font-weight:700;color:${rateClr}">${rate}%</td>
          <td style="font-size:.78rem">${topF.map(([m,c])=>`${ball(+m,'ball-sm')}<span style="font-size:.67rem;color:var(--muted)">${c}次</span>`).join(' ')}</td>
        </tr>`;
      }).join('')}</tbody>
    </table>
    <div style="font-size:.72rem;color:var(--muted);margin-top:6px">理論連莊率 ≈ 12.8%；≥20% 為高連莊傾向號碼</div>
  </div>

  <div class="card">
    <h3>🔭 下期觀察重點</h3>
    <div style="font-size:.86rem;line-height:1.8">${observation(R,w9,superODs)}</div>
  </div>`;
}

function observation(R,w9,sOD){
  const lines=[];
  const zd=R.zoneDist;
  const zero=[1,2,3,4].filter(z=>zd[z]===0);
  if(zero.length) lines.push(`本期 ${zero.map(z=>ZL[z]).join('、')} 開出0碼，斷區走勢是否延續值得觀察。`);
  const maxZ=[1,2,3,4].reduce((a,b)=>zd[a]>zd[b]?a:b);
  if(zd[maxZ]>=3) lines.push(`${ZL[maxZ]} 本期強勢開出 ${zd[maxZ]} 碼，注意是否延續。`);
  if(w9.length) lines.push(`${w9.map(f2).join('、')} 號已沉寂9期，下期若未開即列排除。`);
  if(sOD.length) lines.push(`超期候選：${sOD.slice(0,3).map(n=>`${f2(n)}（×${od(n)}倍）`).join('、')} 回歸壓力持續。`);
  if(!lines.length) lines.push('本期走勢平穩，無特殊異常，可參考選號分析。');
  return lines.join('<br>');
}

// ── RENDER: PICK ───────────────────────────────────────────
// ── 💼 固定投資盤：回歸前2名＋逾期（不含超期）＋動態3中保證輪盤 ──
const FX_MAX=49, FX_PICK=6;
const fxCost = t => `${t} 注 × HK$10 = HK$${t*10}/期`;
const FX_MODES=[
  {id:'eco',name:'💰 節約盤',k:2,lo:7,hi:9,excl:true, tag:'池最小、每期成本最低（使用者原始規則）'},
  {id:'bal',name:'⚖️ 平衡盤',k:3,lo:6,hi:9,excl:false,tag:'池中等、發動率與成本折衷'},
  {id:'max',name:'🚀 衝發動率盤',k:4,lo:7,hi:9,excl:false,tag:'池最大、發動最頻繁；池偶爾過大會拒算，改小檔即可'}];
function fxMode(){ const id=lsGet('m6fxMode'); return FX_MODES.find(m=>m.id===id)||FX_MODES[0]; }
function setFxMode(id){ lsSet('m6fxMode',id); render(); }
function fixedPool(){
  const m=fxMode();
  const dist=buildReturnDist(rec);
  const topGaps=Object.entries(dist).sort((a,b)=>b[1]-a[1]||(+a[0])-(+b[0])).slice(0,m.k).map(e=>+e[0]);
  const ret=[],over=[];
  for(let n=1;n<=FX_MAX;n++){
    const s=st[n]; if(!s||!s.ag) continue;
    if(m.excl&&s.ab/s.ag>=2) continue;             // 超期（≥2×平均間隔）排除（節約盤）
    if(topGaps.includes(s.ab)) ret.push(n);        // 沉寂期數命中回歸排名前K間隔
    else if(s.ab>=m.lo&&s.ab<=m.hi) over.push(n);  // 逾期區間
  }
  return {mode:m,topGaps,ret,over,pool:[...ret,...over].sort((a,b)=>a-b)};
}
// 三檔模式的歷史發動率即時回測（out-of-sample：每期只用該期之前的紀錄建池），記憶化避免重算
let FX_BT=null;
function fxBacktest(){
  if(FX_BT&&FX_BT.n===rec.length) return FX_BT;
  const MINH=60, chron=[...rec].reverse();  // 舊→新
  const res={}; FX_MODES.forEach(m=>res[m.id]={hit:0,tested:0,poolSum:0});
  const dist={}, last={}, tot={}, cnt={};
  for(let t=0;t<chron.length;t++){
    if(t>=MINH){
      const gapsSorted=Object.entries(dist).sort((a,b)=>b[1]-a[1]||(+a[0])-(+b[0]));
      for(const m of FX_MODES){
        const topGaps=gapsSorted.slice(0,m.k).map(e=>+e[0]);
        const pool=new Set();
        for(let n=1;n<=FX_MAX;n++){
          if(last[n]===undefined||!cnt[n]) continue;
          const ag=tot[n]/cnt[n]; if(!ag) continue;
          const ab=t-last[n]-1;
          if(m.excl&&ab/ag>=2) continue;
          if(topGaps.includes(ab)) pool.add(n);
          else if(ab>=m.lo&&ab<=m.hi) pool.add(n);
        }
        const r=res[m.id]; r.tested++; r.poolSum+=pool.size;
        if(chron[t].n.every(x=>pool.has(x))) r.hit++;
      }
    }
    for(const n of chron[t].n){
      if(last[n]!==undefined){ const g=t-last[n]-1; dist[g]=(dist[g]||0)+1; tot[n]=(tot[n]||0)+g; cnt[n]=(cnt[n]||0)+1; }
      last[n]=t;
    }
  }
  FX_BT={n:rec.length,res};
  return FX_BT;
}
function fxNote(m){
  const r=fxBacktest().res[m.id];
  if(!r||!r.tested) return m.tag+'｜歷史資料不足，暫無回測';
  const pct=r.hit/r.tested*100;
  const rate=r.hit>0?`${pct.toFixed(pct<1?2:1)}%（約每 ${Math.round(r.tested/r.hit)} 期一次）`:'0%（回測期間未發動）';
  return `${r.tested}期回測發動率 ${rate}｜池平均 ${(r.poolSum/r.tested).toFixed(0)} 碼｜${m.tag}（數字隨每期開獎自動重算）`;
}
function fxComb(n,k){ if(k<0||k>n) return 0; let r=1; for(let i=0;i<k;i++) r=r*(n-i)/(i+1); return Math.round(r); }
function fxPop(x){ x=x-((x>>1)&0x55555555); x=(x&0x33333333)+((x>>2)&0x33333333); return (((x+(x>>4))&0x0f0f0f0f)*0x01010101)>>24; }
function fixedWheelGen(pool){
  const N=pool.length, K=FX_PICK;
  if(N<K) return {err:`池只有 ${N} 碼，至少需要 ${K} 碼才能投注`};
  if(N<=K+1) return {tickets:[pool.slice(0,K)],verified:true,combos:fxComb(N,K)};
  if(N>31) return {err:`池有 ${N} 碼，超過動態輪盤上限 31 碼（等池縮小或改用其他打法）`};
  const total=fxComb(N,K);
  if(total>500000) return {err:`池 ${N} 碼的開獎組合數 ${total.toLocaleString()} 過大，瀏覽器無法即時演算（請改用池較小的模式）`};
  const combos=new Int32Array(total);
  { const idx=Array.from({length:K},(_,i)=>i); let ptr=0;
    while(true){
      let m=0; for(const i of idx) m|=1<<i;
      combos[ptr++]=m;
      let i=K-1;
      while(i>=0&&idx[i]===N-K+i) i--;
      if(i<0) break;
      idx[i]++; for(let j=i+1;j<K;j++) idx[j]=idx[j-1]+1;
    } }
  const covered=new Uint8Array(total);
  let unc=total;
  const tickets=[];
  let seed=((rec[0]?.p||1)>>>0)%2147483647; pool.forEach(n=>seed=(seed*31+n)%2147483647); if(seed<=0) seed=1;
  const rnd=()=>((seed=seed*48271%2147483647)-1)/2147483646;
  while(unc>0){
    const sampU=[];
    if(unc<=3000){ for(let i=0;i<total;i++) if(!covered[i]) sampU.push(i); }
    else { let tries=0; while(sampU.length<2500&&tries<25000){ const i=(rnd()*total)|0; if(!covered[i]) sampU.push(i); tries++; }
      if(!sampU.length){ for(let i=0;i<total&&sampU.length<2500;i++) if(!covered[i]) sampU.push(i); } }
    const nc=Math.min(600,sampU.length), cands=[];
    for(let c=0;c<nc;c++) cands.push(combos[sampU[(rnd()*sampU.length)|0]]);
    let best=cands[0],bestScore=-1;
    for(const t of cands){ let s=0; for(const i of sampU){ if(fxPop(t&combos[i])>=3) s++; } if(s>bestScore){bestScore=s;best=t;} }
    tickets.push(best);
    for(let i=0;i<total;i++){ if(!covered[i]&&fxPop(best&combos[i])>=3){covered[i]=1;unc--;} }
  }
  // 剪枝：移除多餘票（覆蓋計數法；池過大時跳過以免手機卡頓）
  if(total<=250000){
    const cnt=new Uint8Array(total);
    for(const t of tickets) for(let i=0;i<total;i++){ if(fxPop(t&combos[i])>=3&&cnt[i]<255) cnt[i]++; }
    for(let k=tickets.length-1;k>=0;k--){
      const t=tickets[k]; let removable=true;
      for(let i=0;i<total;i++){ if(fxPop(t&combos[i])>=3&&cnt[i]<2){removable=false;break;} }
      if(removable){ for(let i=0;i<total;i++){ if(fxPop(t&combos[i])>=3) cnt[i]--; } tickets.splice(k,1); }
    }
  }
  // 窮舉驗證：每一種可能開獎組合都至少被一注覆蓋 ≥3 碼
  let verified=true;
  for(let i=0;i<total;i++){ let ok=false; for(const t of tickets){ if(fxPop(t&combos[i])>=3){ok=true;break;} } if(!ok){verified=false;break;} }
  const asNums=tickets.map(m=>{ const a=[]; for(let i=0;i<N;i++) if(m&(1<<i)) a.push(pool[i]); return a; });
  return {tickets:asNums,verified,combos:total};
}

function renderAnnual(el){

  const tailSorted=Object.entries(A.tailBias).sort((a,b)=>b[1]-a[1]);

          `🚫 <strong>迴避${coldNums.map(n=>String(n).padStart(2,'0')).join('/')}</strong>：年度最冷號碼（各只出現${freq[coldNums[0]]}次）`,

// ── RENDER: STATS ──────────────────────────────────────────
function renderStats(el){
  const zc10=zoneCounts(10);
  const zc5r=zoneCounts(5);
  const zc5p={1:0,2:0,3:0,4:0};
  rec.slice(5,10).forEach(r=>r.n.forEach(n=>{zc5p[Z(n)]++;}));

  const tc=tailCounts(10);
  const maxT=Math.max(...Object.values(tc));

  // Long-term tail analysis using t50/t100 accumulated data
  const tail50={}, tail100={};
  for(let t=0;t<=9;t++){tail50[t]=0;tail100[t]=0;}
  for(let n=1;n<=49;n++){
    if(st[n]){tail50[n%10]+=st[n].t50;tail100[n%10]+=st[n].t100;}
  }
  // Expected: tail0 has 4 nums (10,20,30,40), tails 1-9 have 5 nums each
  const exp50 = t => t===0?+(50*6*4/49).toFixed(1):+(50*6*5/49).toFixed(1);
  const exp100 = t => t===0?+(100*6*4/49).toFixed(1):+(100*6*5/49).toFixed(1);
  const tailBias50 = t => +((tail50[t]/exp50(t)-1)*100).toFixed(1);
  const tailsSorted50 = Array.from({length:10},(_,i)=>i).sort((a,b)=>tailBias50(b)-tailBias50(a));

  const topOD=candidates().sort((a,b)=>od(b)-od(a)).slice(0,10);

  // Return history stats
  function retStats(n) {
    const h = retHist[n];
    if (!h || h.length === 0) return null;
    const gaps = h.map(x=>x.gap);
    const avg = (gaps.reduce((a,b)=>a+b,0)/gaps.length).toFixed(1);
    return { count: h.length, avg, min: Math.min(...gaps), max: Math.max(...gaps), last: h[h.length-1] };
  }

  // Numbers with any return history, sorted by count desc
  const numsWithHist = Array.from({length:49},(_,i)=>i+1)
    .filter(n => retHist[n] && retHist[n].length > 0)
    .sort((a,b) => (retHist[b]?.length||0) - (retHist[a]?.length||0));

  el.innerHTML=`
  <div class="card">
    <h3>📊 區間走勢（近5期 vs 前5期）</h3>
    <table>
      <thead><tr><th>區間</th><th>前5期</th><th>近5期</th><th>合計</th><th>趨勢</th></tr></thead>
      <tbody>${[1,2,3,4].map(z=>{
        const r5=zc5r[z],p5=zc5p[z];
        const tr=r5>p5?'升溫🔺':r5<p5?'降溫🔻':'持平➡';
        return `<tr><td><span style="color:var(--z${z});font-weight:600">${ZN[z]}</span></td>
          <td>${p5}</td><td style="font-weight:600">${r5}</td><td>${zc10[z]}</td><td>${tr}</td></tr>`;
      }).join('')}</tbody>
    </table>
  </div>

  <div class="card">
    <h3>📉 長期尾數偏移分析（選號核心規律）</h3>
    <p style="font-size:.78rem;color:var(--muted);margin-bottom:10px">依50期偏移排序。此規律在50期、100期均高度穩定，為尾數優先流的理論依據。</p>
    <table>
      <thead><tr>${thSort('st-tail','t','尾數')}${thSort('st-tail','act50','50期實際')}<th>50期理論</th>${thSort('st-tail','b50','偏移')}${thSort('st-tail','b100','100期偏移')}<th>號碼</th></tr></thead>
      <tbody>${applySort(Array.from({length:10},(_,i)=>({t:i,act50:tail50[i],b50:tailBias50(i),b100:+((tail100[i]/exp100(i)-1)*100).toFixed(1)})),'st-tail','b50','desc').map(({t,act50,b50,b100})=>{
        const nums=Array.from({length:49},(_,i)=>i+1).filter(n=>n%10===t);
        const color=b50>=20?'#dc2626':b50<=-15?'#2563eb':b50>=10?'#d97706':'var(--text)';
        const bg=b50>=20?'#fee2e2':b50<=-15?'#dbeafe':'';
        return `<tr style="background:${bg}">
          <td><strong style="font-size:1rem;color:${color}">尾${t}</strong></td>
          <td style="text-align:center;font-weight:600;color:${color}">${act50}</td>
          <td style="text-align:center;color:var(--muted)">${exp50(t)}</td>
          <td style="text-align:center;font-weight:700;color:${color}">${b50>0?'+':''}${b50}%</td>
          <td style="text-align:center;color:${b100>=10?'#dc2626':b100<=-10?'#2563eb':'var(--muted)'}">${b100>0?'+':''}${b100}%</td>
          <td style="font-size:.75rem;color:var(--muted)">${nums.map(f2).join(', ')}</td>
        </tr>`;
      }).join('')}</tbody>
    </table>
    <div style="margin-top:8px;font-size:.75rem;color:var(--muted)">理論值基於等機率分佈：尾0（3個號）期望值較低，其餘尾數（4個號）期望值較高</div>
  </div>

  <div class="card">
    <h3>🔢 尾數分佈（近10期）</h3>
    <div class="tail-grid">
      ${Array.from({length:10},(_,i)=>{
        const c=tc[i], pct=maxT?c/maxT*100:0;
        const hot=c>=4,cold=c===0;
        return `<div class="tail-cell" style="${hot?'background:#fee2e2':cold?'background:#dbeafe':''}">
          <div class="tv" style="color:${hot?'#dc2626':cold?'#2563eb':'var(--text)'}">${c}</div>
          <div class="tl">尾 ${i}</div>
          <div class="bar-wrap"><div class="bar-fill" style="width:${pct}%;background:${hot?'#dc2626':cold?'#2563eb':'#16a34a'}"></div></div>

    <div style="margin-top:8px;font-size:.78rem;color:var(--muted)">
      過熱（≥4次）：${Object.entries(tc).filter(([,v])=>v>=4).map(([k])=>`尾${k}`).join('、')||'無'} ／
      冰冷（0次）：${Object.entries(tc).filter(([,v])=>v===0).map(([k])=>`尾${k}`).join('、')||'無'}
    </div>
  </div>

  <div class="card">
    <h3>🔁 回歸統計（實際回歸間隔）</h3>
    ${numsWithHist.length === 0
      ? '<div style="color:var(--muted);font-size:.83rem">尚無紀錄。每次輸入新開獎號碼後自動累積。</div>'

      <thead><tr>${thSort('st-ret','n','號碼')}${thSort('st-ret','count','回歸次數')}${thSort('st-ret','avg','平均沉寂期')}${thSort('st-ret','min','最短')}${thSort('st-ret','max','最長')}<th>上次沉寂</th></tr></thead>
      <tbody>${applySort(numsWithHist.map(n=>{const s=retStats(n);return {n,count:s.count,avg:+s.avg,min:s.min,max:s.max,last:s.last,diff:st[n]?.ag?(+s.avg-st[n].ag).toFixed(1):null};}), 'st-ret','count','desc').map(({n,count,avg,min,max,last,diff}) => {
        const diffColor = diff === null ? '' : parseFloat(diff) > 0 ? 'color:#dc2626' : parseFloat(diff) < 0 ? 'color:#16a34a' : '';
        return `<tr>
          <td>${ball(n,'ball-sm')}</td>

  <div class="card">

    ${(()=>{

// ── RENDER: TRACK ──────────────────────────────────────────
function pNorm(z){
  const t=1/(1+0.2316419*Math.abs(z));
  const p=1-(1/Math.sqrt(2*Math.PI))*Math.exp(-z*z/2)*t*(0.319381530+t*(-0.356563782+t*(1.781477937+t*(-1.821255978+t*1.330274429))));
  return z>=0?p:1-p;
}
function statsFromVals(vals,mu0){
  const n=vals.length;
  if(n<3) return null;
  const mean=vals.reduce((a,b)=>a+b,0)/n;
  const variance=n>1?vals.reduce((a,b)=>a+(b-mean)**2,0)/(n-1):0;
  const std=Math.sqrt(variance);
  const se=std/Math.sqrt(n);
  const tCrit=n>=30?1.96:n>=20?2.09:n>=15?2.14:n>=10?2.23:n>=5?2.57:3.18;
  const ci=[+(mean-tCrit*se).toFixed(2),+(mean+tCrit*se).toFixed(2)];
  const tStat=std<0.001?0:(mean-mu0)/se;
  const pval=+(2*(1-pNorm(Math.abs(tStat)))).toFixed(3);
  const nNeeded=std>0&&Math.abs(mean-mu0)>0.01?Math.min(500,Math.ceil(Math.pow(2.80*std/Math.abs(mean-mu0),2))):null;
  return{mean:+mean.toFixed(2),std:+std.toFixed(2),ci,pval,nNeeded};
}

          :`⚠️ ${rows.length} 個深度中有 ${outliers} 個超出 ±2σ（紅柱）。深度越深樣本越少、波動越大，多屬隨機起伏，不建議視為可下注的訊號。`}
      </div>`;
    })()}
  </div>

  <div class="card">
    <h3>🏆 歷史兌獎紀錄（${pickLog.length} 筆）</h3>

  ${oldRows.length?`<div class="card" style="opacity:.85">

  </div>

  <div class="card">
    <h3>📊 目前各號碼狀態</h3>
    <table>
      <thead><tr>${thSort('cfg-st','n','號碼')}${thSort('cfg-st','ab','沉寂期')}${thSort('cfg-st','ag','平均間隔')}${thSort('cfg-st','mg','最大間隔')}${thSort('cfg-st','ratio','逾期倍數')}</tr></thead>
      <tbody>${applySort(Array.from({length:49},(_,i)=>i+1).map(n=>({n,ab:st[n].ab,ag:st[n].ag,mg:st[n].mg,ratio:od(n),ex:excl(n)})),'cfg-st','ab','desc').map(({n,ab,ag,mg,ratio,ex})=>{
        return `<tr style="${ex?'background:#fee2e2':''}">
          <td>${ex?ballX(n,'ball-sm'):ball(n,'ball-sm')}</td>
          <td>${ab}</td><td>${ag}</td><td>${mg}</td>
          <td style="color:${ex?'#dc2626':ratio>=2?'var(--od)':ratio>=1?'var(--warn)':'var(--muted)'};font-weight:${ratio>=1||ex?'700':'400'}">
            ${ex?'🚫排除':'×'+ratio}
          </td>
        </tr>`;
      }).join('')}</tbody>
    </table>
  </div>`;
}

// ── RENDER: COMPANION ──────────────────────────────────────
function renderCompanion(el) {
  const pairs = buildPairStat();
  const total = rec.length;
  const randExp = +(total * 2 / (49 * 48 / 2) * C2_ADJ()).toFixed(1);

  function C2_ADJ() { return 6*5/2; } // 每期 C(6,2)=15 個 pair

  // 排行榜
  const topPairs = Object.entries(pairs)
    .map(([k,cnt]) => { const [a,b]=k.split('-').map(Number); return {a,b,cnt,pct:+(cnt/total*100).toFixed(1)}; })
    .sort((x,y)=>y.cnt-x.cnt).slice(0,20);

  // 單號查詢
  const companions = Array.from({length:49},(_,i)=>i+1)
    .filter(n=>n!==compNum)
    .map(n => {
      const k = compNum<n?`${compNum}-${n}`:`${n}-${compNum}`;
      return {n, cnt:pairs[k]||0, pct:+((pairs[k]||0)/total*100).toFixed(1)};
    }).sort((a,b)=>b.cnt-a.cnt);

  const maxCnt = topPairs[0]?.cnt || 1;
  const randLine = +(total*6*5/2/(49*48/2)).toFixed(1);

  el.innerHTML = `
  <div class="card">
    <h3>🤝 高頻同伴排行 TOP 20（共 ${total} 期）</h3>
    <div style="font-size:.78rem;color:var(--muted);margin-bottom:10px">同一期同時出現次數最多的號碼對，隨機期望 ≈ ${randLine} 次</div>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>#</th><th>號碼對</th><th style="text-align:center">共現次數</th><th style="text-align:center">頻率</th><th>相對強度</th></tr></thead>
      <tbody>${topPairs.map(({a,b,cnt,pct},i)=>`
        <tr>
          <td style="color:var(--muted);font-size:.75rem">${i+1}</td>
          <td>${ball(a,'ball-sm')} ${ball(b,'ball-sm')}</td>
          <td style="font-weight:700;text-align:center">${cnt}</td>
          <td style="text-align:center;color:var(--muted);font-size:.8rem">${pct}%</td>
          <td style="min-width:80px"><div class="bar-wrap"><div class="bar-fill" style="width:${cnt/maxCnt*100}%;background:var(--primary)"></div></div></td>
        </tr>`).join('')}
      </tbody>
    </table></div>
  </div>

  <div class="card">
    <h3>🔍 單號同伴查詢</h3>
    <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px">
      ${Array.from({length:49},(_,i)=>i+1).map(n=>`
        <span onclick="compNum=${n};renderCompanion(document.getElementById('content'))"
          class="ball ball-sm ${ZC[Z(n)]}"
          style="cursor:pointer;outline:${compNum===n?'2.5px solid #1e293b':'2px solid transparent'};outline-offset:1px">${f2(n)}</span>`).join('')}
    </div>
    <div style="font-size:.85rem;font-weight:700;margin-bottom:8px">
      ${ball(compNum,'ball-sm')} 號碼 ${f2(compNum)} 的同伴頻率（前 10 名）
    </div>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>同伴</th><th style="text-align:center">同期次數</th><th style="text-align:center">頻率</th><th>強度</th></tr></thead>
      <tbody>${companions.slice(0,10).map(({n,cnt,pct})=>`
        <tr>
          <td>${ball(n,'ball-sm')}</td>
          <td style="font-weight:700;text-align:center">${cnt}</td>
          <td style="text-align:center;font-size:.8rem;color:var(--muted)">${pct}%</td>
          <td style="min-width:80px"><div class="bar-wrap"><div class="bar-fill" style="width:${companions[0].cnt?cnt/companions[0].cnt*100:0}%;background:var(--z2)"></div></div></td>
        </tr>`).join('')}
      </tbody>
    </table></div>
    <div style="font-size:.72rem;color:var(--muted);margin-top:8px">隨機期望 ≈ ${randLine} 次（${total} 期 × 理論同現機率）</div>
  </div>`;
}

function applyStats(){
  const raw=document.getElementById('st-paste').value.trim();
  if(!raw) return;
  let cnt=0;
  raw.split('\n').forEach(line=>{
    const p=line.trim().split(/\s+/).map(Number);
    if(p.length>=9){
      const [num,mg,ag,mc,ab,tt,t20,t50,t100]=p;
      if(num>=1&&num<=49){ st[num]={mg,ag,mc,ab,tt,t20,t50,t100}; cnt++; }
    }
  });
  save();
  alert(`已更新 ${cnt} 個號碼`);
  render();
}

function resetAll(){
  if(!confirm('確認重設全部資料回預設值？\n（含開獎紀錄、統計、押注紀錄）')) return;
  rec=JSON.parse(JSON.stringify(BASE_REC));
  st=JSON.parse(JSON.stringify(BASE_ST));
  retHist={};
  conStat=buildConStat(rec);
  pendingPick=null;
  pickLog=[];
  savePickLog();
  save();
  lastReport=null;
  updateHdr();
  alert(`✅ 已重設完成！\n${rec[0].draw||rec[0].p}（${rec[0].dt||""}），共 ${rec.length} 筆。\n押注紀錄已清空。`);
  go('pick');
}

// ── ADD DRAW ───────────────────────────────────────────────
function addDraw(){
  const pv=parseInt(document.getElementById('inp-period').value);
  const ni=[...document.querySelectorAll('.ni')];
  const nums=ni.map(i=>parseInt(i.value)).filter(n=>n>=1&&n<=49);

  if(!pv||pv<24000){ alert('請輸入有效期號（如 26067）'); return; }
  if(nums.length!==6){ alert('請輸入6個 01–49 的號碼'); return; }
  if(new Set(nums).size!==6){ alert('號碼不可重複'); return; }
  if(rec[0]&&pv<=rec[0].p){ alert(`期號需大於目前最新（${rec[0].p}）`); return; }

  const sorted=nums.sort((a,b)=>a-b);

  // snapshot pre-update stats for report
  const drawn=sorted.map(n=>({n,abBefore:st[n]?st[n].ab:0,ratio:od(n)}));
  const zd={1:0,2:0,3:0,4:0}; sorted.forEach(n=>{zd[Z(n)]++;});

  // record return history BEFORE updating absent counts
  sorted.forEach(n => {
    const gap = st[n] ? st[n].ab : 0;
    if (!retHist[n]) retHist[n] = [];
    retHist[n].push({period: pv, gap});
  });

  // record consecutive stat: prev draw → current draw
  const repeatNums = [];
  if (rec.length > 0) {
    const prev = rec[0].n;
    prev.forEach(n => {
      if (!conStat[n]) conStat[n] = {total:0, repeats:0, followedBy:{}};
      conStat[n].total++;
      if (sorted.includes(n)) { conStat[n].repeats++; repeatNums.push(n); }
      sorted.forEach(m => { conStat[n].followedBy[m] = (conStat[n].followedBy[m]||0)+1; });
    });
  }

  // update stats
  for(let n=1;n<=49;n++){
    if(!st[n]) continue;
    st[n].ab = sorted.includes(n) ? 0 : st[n].ab+1;
  }

  // check pending pick against this draw result
  if(pendingPick) {
    const hits = {};
    const hitNums = {};
    for(const [k,nums] of Object.entries(pendingPick.strategies)) {
      const matched = nums.filter(n => sorted.includes(n));
      hits[k] = matched.length;
      hitNums[k] = matched;
    }
    const excHits=pendingPick.excluded?sorted.filter(n=>pendingPick.excluded.includes(n)).length:null;
    pickLog.unshift({period:pv, ...(pendingPick.v?{v:pendingPick.v,algo:pendingPick.algo,seed:pendingPick.seed,hi:pendingPick.hi,...(pendingPick.exclAlgo?{exclAlgo:pendingPick.exclAlgo}:{})}:{}), strategies:pendingPick.strategies, result:sorted, hits, hitNums, excludedHits:excHits, excluded:pendingPick.excluded, ts:pendingPick.ts});
    pendingPick = null;
    savePickLog();
  }

  // add record
  const extraNum=parseInt(document.getElementById('inp-extra')?.value||'0')||0;
  rec.unshift({p:pv,dt:new Date().toISOString().split('T')[0],n:sorted,e:extraNum});
  if(document.getElementById('inp-extra')) document.getElementById('inp-extra').value='';
  ANNUAL = buildAnnual(rec);
  save();

  lastReport={period:pv,nums:sorted,drawn,zoneDist:zd,repeatNums};

  // clear inputs
  document.getElementById('inp-period').value='';
  ni.forEach(i=>{i.value='';});

  updateHdr();
  go('pick');
}

// ── KEYBOARD SHORTCUTS ─────────────────────────────────────
document.getElementById('inp-period').addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key==='\t') document.querySelectorAll('.ni')[0].focus();
});
document.querySelectorAll('.ni').forEach((inp,i,all)=>{
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter') i<all.length-1 ? all[i+1].focus() : addDraw();
  });
  inp.addEventListener('input',()=>{
    if(inp.value.length>=2&&i<all.length-1) all[i+1].focus();
  });
});

// ── HEADER ─────────────────────────────────────────────────
function updateHdr(){
  const r=rec[0];
  document.getElementById('hdr-info').innerHTML=r
    ?`${r.draw||r.p}（${r.dt||''}）<br>${r.n.map(f2).join(' ')} <span style='color:#fde68a'>+${r.e||'?'}</span>`
    :'尚無紀錄';
}

// ── INIT ───────────────────────────────────────────────────
load();
updateHdr();
render();
</script>
