<style>

  --bg: #f0f4f8;

}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* Tables */
table { width: 100%; border-collapse: collapse; font-size: .83rem; }
th { text-align: left; padding: 7px 8px; color: var(--muted); font-weight: 600; border-bottom: 1.5px solid var(--border); font-size: .75rem; }
td { padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }

/* Alerts */
.alert { border-radius: 8px; padding: 10px 12px; font-size: .83rem; margin-bottom: 8px; line-height: 1.6; }
.alert-danger { background: #fee2e2; color: #991b1b; }

/* Group cards */
.grp { border: 1.5px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 10px; }

/* Stats */
.zone-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
.zone-box { border-radius: 8px; padding: 10px 8px; text-align: center; }

/* Num row */

/* Empty */

/* Settings textarea */

<script>document.write('<script src="data_539.js?v=' + Date.now() + '"><\/script>');</script>
<script>
// ── CONSTANTS ──────────────────────────────────────────────
const Z = n => n<=9?1:n<=19?2:n<=29?3:4;
const ZN = ['','一區 01-09','二區 10-19','三區 20-29','四區 30-39'];
const ZL = ['','一區','二區','三區','四區'];
const ZC = ['','z1','z2','z3','z4'];
const f2 = n => String(n).padStart(2,'0');


// ── STORAGE ────────────────────────────────────────────────
let rec = [], st = {}, retHist = {}, conStat = {}, ANNUAL = null;
let pendingPick = null;  // {strategies:{G1:[...], ...}, ts: timestamp}
let pickLog = [];        // [{period, strategies, result, hits, ts}]
let compNum = 8;         // 同伴分析選中的號碼
// retHist[num] = [{period, gap}, ...]
// conStat[num] = {total, repeats, followedBy:{m:count,...}}
//   total      = times num appeared as "previous draw" predecessor
//   repeats    = times num also appeared in the very next draw (連莊)
//   followedBy = for each number m, how many times m appeared in the next draw after num

function buildConStat(records) {
  const s = {};
  const ordered = [...records].reverse(); // chronological
  for (let i = 0; i < ordered.length - 1; i++) {
    const prev = ordered[i].n, curr = ordered[i+1].n;
    prev.forEach(n => {
      if (!s[n]) s[n] = {total:0, repeats:0, followedBy:{}};
      s[n].total++;
      if (curr.includes(n)) s[n].repeats++;
      curr.forEach(m => { s[n].followedBy[m] = (s[n].followedBy[m]||0)+1; });
    });
  }
  return s;
}

function buildRetHistFromRec(records, maxN) {
  const rh = {};
  const ordered = [...records].reverse();
  const firstSeen = new Set();
  const absence = new Array(maxN+1).fill(0);
  for (const r of ordered) {
    for (let n=1; n<=maxN; n++) {
      if (r.n.includes(n)) {
        if (firstSeen.has(n)) {
          if (!rh[n]) rh[n] = [];
          rh[n].push({period: r.p, gap: absence[n]});
        }
        firstSeen.add(n);
        absence[n] = 0;
      } else if (firstSeen.has(n)) {
        absence[n]++;
      }
    }
  }
  return rh;
}

function buildPairStat() {
  const pairs = {};
  rec.forEach(r => {
    const sorted = [...r.n].sort((a,b)=>a-b);
    for(let i=0;i<sorted.length-1;i++)
      for(let j=i+1;j<sorted.length;j++) {
        const k = `${sorted[i]}-${sorted[j]}`;
        pairs[k] = (pairs[k]||0)+1;
      }
  });
  return pairs;
}

function reconstructLastReport() {
  if (!rec[0]) return;
  const sorted = rec[0].n;
  const pv = rec[0].p;
  const drawn = sorted.map(n => {
    let abBefore = 0;
    for (let i = 1; i < rec.length; i++) {
      if (rec[i].n.includes(n)) { abBefore = i - 1; break; }
      abBefore = i;
    }
    return {n, abBefore, ratio: +(abBefore / (st[n]?.ag || 1)).toFixed(2)};
  });
  const zd = {1:0,2:0,3:0,4:0};
  sorted.forEach(n => {zd[Z(n)]++;});
  const repeatNums = rec[1] ? sorted.filter(n => rec[1].n.includes(n)) : [];
  lastReport = {period:pv, nums:sorted, drawn, zoneDist:zd, repeatNums};
}

// localStorage 在 iOS file:// 下可能被封鎖，統一包 try/catch
function lsGet(k) { try { return localStorage.getItem(k); } catch(e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch(e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch(e) {} }

function load() {
  const r = lsGet('539r');
  const s = lsGet('539s');
  const h = lsGet('539h');
  const storedRec = r ? JSON.parse(r) : null;
  // Auto-upgrade: if stored data is behind BASE_REC, reset to BASE_REC
  if (!storedRec || storedRec[0]?.p < BASE_REC[0].p) {
    rec     = JSON.parse(JSON.stringify(BASE_REC));
    st      = JSON.parse(JSON.stringify(BASE_ST));
    retHist = buildRetHistFromRec(rec, 39);
    conStat = buildConStat(rec);
    save();
  } else {
    rec     = storedRec;
    st      = s ? JSON.parse(s) : JSON.parse(JSON.stringify(BASE_ST));
    const parsedH = h ? JSON.parse(h) : null;
    retHist = (parsedH && Object.keys(parsedH).length > 0) ? parsedH : buildRetHistFromRec(rec, 39);
    conStat = buildConStat(rec);
  }
  ANNUAL = buildAnnual(rec);
  loadPickLog();
  reconstructLastReport();
}
function save() {
  lsSet('539r', JSON.stringify(rec));
  lsSet('539s', JSON.stringify(st));
  lsSet('539h', JSON.stringify(retHist));
}
function loadPickLog() {
  const p = lsGet('539pp');
  const l = lsGet('539pl');
  // pendingPick：優先用 localStorage（手動鎖定），否則用 BASE_PENDING（自動預測）
  pendingPick = p ? JSON.parse(p) : (BASE_PENDING ? JSON.parse(JSON.stringify(BASE_PENDING)) : null);
  // pickLog：BASE_PICKLOG 為基底，localStorage 追加未同步的紀錄
  const base = BASE_PICKLOG ? JSON.parse(JSON.stringify(BASE_PICKLOG)) : [];
  const local = l ? JSON.parse(l) : [];
  const basePeriods = new Set(base.map(e=>e.period));
  const extra = local.filter(e=>!basePeriods.has(e.period));
  pickLog = [...extra, ...base];
}
function savePickLog() {
  if(pendingPick) lsSet('539pp', JSON.stringify(pendingPick));
  else lsDel('539pp');
  // 只存 BASE_PICKLOG 沒有的本地紀錄
  const basePeriods = new Set(BASE_PICKLOG.map(e=>e.period));
  lsSet('539pl', JSON.stringify(pickLog.filter(e=>!basePeriods.has(e.period))));
}
function lockPick() {
  const {g1,g3,g5,g6,g8,g9,g10,g11,gc} = allGroups();
  const s = {};
  if(g1) s.G1=g1.nums; if(g3) s.G3=g3.nums; if(g5) s.G5=g5.nums;
  if(g6) s.G6=g6.nums; if(g8) s.G8=g8.nums; if(g9) s.G9=g9.nums;
  if(g10) s.G10=g10.nums; if(g11) s.G11=g11.nums;
  const g0=genG0(); if(g0) s.G0=g0;
  if(gc) s.GC=gc.nums;
  pendingPick = {strategies:s, excluded:calcExcludeZone().exclude, ts:Date.now()};
  savePickLog();
  alert('✅ 已鎖定本期9組選號＋G0隨機對照！\n（含 G11 冷門組合、GC 覆蓋度立柱10碼）\n輸入下期開獎號碼後將自動計算命中數。\n前往「🏆 中獎追蹤」查看狀態。');
}

// ── CORE ANALYSIS ──────────────────────────────────────────
const od   = n => st[n] ? +(st[n].ab / st[n].ag).toFixed(2) : 0;
const sat  = n => st[n] ? +((st[n].ab / st[n].mg)*100).toFixed(1) : 0;
const excl = n => st[n] ? st[n].ab >= st[n].mg : true;

function candidates() { return Array.from({length:39},(_,i)=>i+1).filter(n=>!excl(n)); }
function excluded()   { return Array.from({length:39},(_,i)=>i+1).filter(n=>excl(n)); }

function zoneCounts(sliceN=10) {
  const c={1:0,2:0,3:0,4:0};
  rec.slice(0,sliceN).forEach(r=>r.n.forEach(n=>{c[Z(n)]++;}));
  return c;
}

function hotCold(zc) {
  const maxODinZone = z => {
    const pool = candidates().filter(n=>Z(n)===z);
    return pool.length ? Math.max(...pool.map(od)) : 0;
  };
  const sorted = [1,2,3,4].sort((a,b)=>{
    if (zc[b]!==zc[a]) return zc[b]-zc[a];
    return maxODinZone(b)-maxODinZone(a);
  });
  return {hot:sorted[0], cold:sorted[3]};
}

function tailCounts(n=10) {
  const c={};
  for(let i=0;i<=9;i++) c[i]=0;
  rec.slice(0,n).forEach(r=>r.n.forEach(num=>{c[num%10]++;}));
  return c;
}

// ── GROUP GENERATION ───────────────────────────────────────
// 共用：年度熱度分（頻率×70% + 尾偏×30%）
const _annMax = () => ANNUAL.annMax;
function annScore(n) {
  return (ANNUAL.freq[n]/ANNUAL.annMax)*70 + Math.max(0, ANNUAL.tailBias[n%10]||0)/ANNUAL.tailBiasMax*30;
}

// 共用：建立近30期動能數據
function buildMom() {
  const rN = Math.min(30, rec.length);
  const rf = new Array(40).fill(0);
  rec.slice(0, rN).forEach(r => r.n.forEach(n => rf[n]++));
  const annPer = ANNUAL.periods;
  const momFn = n => { const e = ANNUAL.freq[n]/annPer; return e<0.001?0:(rf[n]/rN)/e; };
  return {rN, rf, momFn};
}

// 共用：雙信號評分函數（年度×60% + 動能×40%）
function buildDual(cand) {
  const {momFn} = buildMom();
  const s3max = Math.max(...cand.map(annScore), 0.01);
  const momMax = Math.max(...cand.map(momFn), 0.01);
  const dualFn = n => (annScore(n)/s3max)*60 + (momFn(n)/momMax)*40;
  return {dualFn, momFn};
}

function buildGap(cand) {
  const lastIdx = {};
  cand.forEach(n => lastIdx[n] = rec.length);
  for(let i=0;i<rec.length;i++){
    rec[i].n.forEach(n=>{ if(lastIdx[n]===rec.length) lastIdx[n]=i; });
    if(cand.every(n=>lastIdx[n]<rec.length)) break;
  }
  const gapFn = n => lastIdx[n]??rec.length;
  return {gapFn};
}

function buildReturnDist(records) {
  const dist = {};
  // records[0]=newest, records[N-1]=oldest; iterate oldest→newest
  for(let i=records.length-1; i>=0; i--) {
    for(const n of records[i].n) {
      for(let j=i-1; j>=0; j--) {
        if(records[j].n.includes(n)) {
          const gap = i - j - 1;
          dist[gap] = (dist[gap] || 0) + 1;
          break;
        }
      }
    }
  }
  return dist;
}

// 保留舊的 cs/byCS 供 G4 警告標注用（不再影響選號）
function cs(n) {
  if(!st[n]) return 0; const s=st[n];
  return (s.ab/s.ag)*0.6 + (s.ab/s.mg)*3*0.4;
}
const byCS = arr => [...arr].sort((a,b)=>cs(b)-cs(a));

// 每組策略出號數（2026-07-12 由 5 擴至 8，各策略選號邏輯不變）
const PICK_N = 8;

// G1: 年度熱號流 — 純年度頻率+尾偏，取前 PICK_N（回測效力1.75×）
function genG1(cand) {
  const sorted = [...cand].sort((a,b) => annScore(b)-annScore(a));
  const nums = sorted.slice(0,PICK_N).sort((a,b)=>a-b);
  return {nums, sorted};
}

// G3: 均衡區間流 — 三區覆蓋（一/二/三區各取最強），含連號後處理
function genG3(cand) {
  const {dualFn} = buildDual(cand);
  const byZ = {};
  for(let z=1;z<=4;z++) byZ[z] = [...cand.filter(n=>Z(n)===z)].sort((a,b)=>dualFn(b)-dualFn(a));
  let pool = [...byZ[1].slice(0,3), ...byZ[2].slice(0,3), ...byZ[3].slice(0,3)];
  if(pool.length < PICK_N) pool = [...pool, ...byZ[4]].filter((n,i,a)=>a.indexOf(n)===i);
  pool.sort((a,b)=>dualFn(b)-dualFn(a));
  const nums = ensureConsec(pool.slice(0,PICK_N).sort((a,b)=>a-b), cand, dualFn);
  return {nums, dualFn};
}

// G5: 熱尾優先流 — 動態從 ANNUAL.tailBias 找偏熱/偏冷尾，強制從熱尾選3+碼
function genG5(cand) {
  const {dualFn} = buildDual(cand);
  // 卡方把關（df=9, α=.05 臨界16.92）：尾數分佈與均勻無顯著差異時不啟用熱尾強制
  const T=ANNUAL.periods;
  let chi2=0;
  for(const [t,b] of Object.entries(ANNUAL.tailBias)){const e=T*5*((+t===0?3:4))/39;chi2+=e*Math.pow((+b)/100,2);}
  const tailSig=chi2>=16.92;
  const hotTails=tailSig?Object.entries(ANNUAL.tailBias).filter(([,b])=>+b>=8).map(([t])=>+t):[];
  const coldTails=Object.entries(ANNUAL.tailBias).filter(([,b])=>+b<=-8).map(([t])=>+t);
  if(!hotTails.length){
    const nums=[...cand].sort((a,b)=>dualFn(b)-dualFn(a)).slice(0,PICK_N).sort((a,b)=>a-b);
    return {nums, highTailCnt:0, coldTailCnt:nums.filter(n=>coldTails.includes(n%10)).length, dualFn, hotTails, coldTails, chi2:+chi2.toFixed(1), tailSig};
  }
  const hotPool = [...cand.filter(n=>hotTails.includes(n%10))].sort((a,b)=>dualFn(b)-dualFn(a));
  const coldPool = [...cand.filter(n=>!hotTails.includes(n%10))].sort((a,b)=>dualFn(b)-dualFn(a));
  const hotPicks = hotPool.slice(0, Math.min(PICK_N-2, hotPool.length));
  const rest = coldPool.filter(n=>!hotPicks.includes(n)).slice(0, PICK_N-hotPicks.length);
  const picks = [...hotPicks, ...rest].slice(0,PICK_N);
  const highTailCnt = picks.filter(n=>hotTails.includes(n%10)).length;
  const coldTailCnt = picks.filter(n=>coldTails.includes(n%10)).length;
  return {nums: picks.sort((a,b)=>a-b), highTailCnt, coldTailCnt, dualFn, hotTails, coldTails, chi2:+chi2.toFixed(1), tailSig};
}

// G8: 雙信號複合流（年度熱度×60% + 近期動能×40%）— 回測：1.66×隨機（已剔除無效逾期信號）
function genG8(cand) {
  const rN = Math.min(30, rec.length);
  const recentFreq = new Array(40).fill(0);
  rec.slice(0, rN).forEach(r => r.n.forEach(n => recentFreq[n]++));
  const annPer = ANNUAL.periods;
  const momFn = n => { const e = ANNUAL.freq[n]/annPer; return e<0.001?0:(recentFreq[n]/rN)/e; };
  const s3fn = n => (ANNUAL.freq[n]/ANNUAL.annMax)*70 + Math.max(0, ANNUAL.tailBias[n%10]||0)/ANNUAL.tailBiasMax*30;
  const s3max = Math.max(...cand.map(s3fn), 0.01);
  const momMax = Math.max(...cand.map(momFn), 0.01);
  const dualFn = n => (s3fn(n)/s3max)*60 + (momFn(n)/momMax)*40;
  const topRaw = [...cand].sort((a,b) => dualFn(b) - dualFn(a)).slice(0, PICK_N);
  if(topRaw.length < PICK_N) return null;
  const topPick = ensureConsec(topRaw.sort((a,b)=>a-b), cand, dualFn);
  const nums = topPick.sort((a,b) => a-b);
  const momSorted = [...topPick].sort((a,b) => momFn(b) - momFn(a));
  const momPicks = momSorted.slice(0, 2);
  const annPicks = topPick.filter(n => !momPicks.includes(n));
  return {nums, momPicks, annPicks, momFn, recentFreq, rN};
}

// G6: 遺漏壓力流 — 選候選池中遺漏最久的5碼，信號與頻率/動能正交
function genG6(cand) {
  const {gapFn} = buildGap(cand);
  const nums = [...cand].sort((a,b)=>gapFn(b)-gapFn(a)).slice(0,PICK_N).sort((a,b)=>a-b);
  return {nums, gapFn};
}

// G9: 回歸熱區流 — 沉寂期數落在歷史回歸排名前3間隔的號碼，雙信號分取前 PICK_N
// 2026-07-02 100期滾動回測：0.75碼/期，全策略最佳
function genG9() {
  const all = Array.from({length:39},(_,i)=>i+1);
  const dist = buildReturnDist(rec);
  const top3 = Object.entries(dist).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([g])=>+g);
  const {gapFn} = buildGap(all);
  let pool = all.filter(n=>top3.includes(gapFn(n)));
  if(!pool.length) pool = all;
  const {dualFn} = buildDual(pool);
  const nums = [...pool].sort((a,b)=>dualFn(b)-dualFn(a)).slice(0,PICK_N).sort((a,b)=>a-b);
  return {nums, top3, gapFn, dualFn, poolSize:pool.length, dist};
}

// 連號後處理：若選號無連號且歷史連號率>50%，嘗試替換最低分號換入鄰號
function ensureConsec(nums, cand, scoreFn) {
  if(ANNUAL.consecRate < 50) return nums;
  const hasConsec = nums.some(n=>nums.includes(n+1));
  if(hasConsec) return nums;
  const byScore = [...nums].sort((a,b)=>scoreFn(a)-scoreFn(b));
  for(const toOut of byScore) {
    const others = nums.filter(n=>n!==toOut);
    const adj = others.flatMap(n=>[n-1,n+1])
      .filter(n=>n>=1&&n<=39&&!nums.includes(n)&&cand.includes(n));
    if(adj.length) {
      adj.sort((a,b)=>scoreFn(b)-scoreFn(a));
      return [...others, adj[0]].sort((a,b)=>a-b);
    }
  }
  return nums;
}

// G0 隨機對照組：Lehmer LCG 以最新期號為種子，與 fetch script (Python lcg_picks) 完全一致
// 用途：所有策略的空白對照——若 G0 長期「打贏隨機」，代表流程有 bug 而非策略有效
function lcgPicks(seed, numMax, k){
  let x = seed % 2147483646 + 1;
  const picks = new Set();
  while(picks.size < k){
    x = (x * 48271) % 2147483647;
    picks.add(1 + x % numMax);
  }
  return [...picks].sort((a,b)=>a-b);
}
function genG0(){ return rec[0] ? lcgPicks(rec[0].p, 39, PICK_N) : null; }

// G10 使用者策略（2026-07-03）：回歸熱區（間隔占比>11%）主力 + 2碼超期（沉寂≥2×個別平均間隔）
function avgGapPerNum(){
  const tot={},cnt={},last={};
  for(let i=rec.length-1;i>=0;i--){
    const pos=rec.length-1-i;
    rec[i].n.forEach(n=>{
      if(last[n]!==undefined){tot[n]=(tot[n]||0)+(pos-last[n]-1);cnt[n]=(cnt[n]||0)+1;}
      last[n]=pos;
    });
  }
  return n=>cnt[n]?tot[n]/cnt[n]:39/5;
}
function genG10(){
  if(!rec.length) return null;
  const dist=buildReturnDist(rec);
  const total=Object.values(dist).reduce((a,b)=>a+b,0)||1;
  const hotGaps=new Set(Object.entries(dist).filter(([,c])=>c/total>0.11).map(([g])=>+g));
  const all=Array.from({length:39},(_,i)=>i+1);
  const {gapFn}=buildGap(all);
  const agF=avgGapPerNum();
  const {dualFn}=buildDual(all);
  const poolA=all.filter(n=>hotGaps.has(gapFn(n))).sort((a,b)=>dualFn(b)-dualFn(a));
  const poolB=all.filter(n=>gapFn(n)>=2*agF(n)).sort((a,b)=>dualFn(b)-dualFn(a));
  const picks=poolA.slice(0,PICK_N-2);
  for(const pool of [poolB, poolA.slice(PICK_N-2), [...all].sort((a,b)=>dualFn(b)-dualFn(a))])
    for(const n of pool){ if(picks.length>=PICK_N)break; if(!picks.includes(n))picks.push(n); }
  return {nums:picks.slice(0,PICK_N).sort((a,b)=>a-b), hotGaps:[...hotGaps].sort((a,b)=>a-b),
          nA:poolA.length, nB:poolB.length, poolA, poolB, gapFn, agF, dualFn};
}

// ── 方案C輪盤：15碼「3 if 5」保證覆蓋設計（16注）─────────────
// 保證：5 個獎號全落在 15 碼池內時，至少一張中 3 碼（貪婪覆蓋+剪枝驗證）
const WHEEL16 = [[1,2,4,11,13],[1,2,11,13,14],[1,3,4,10,16],[1,3,5,9,10],[1,5,6,11,15],[1,6,8,12,14],[1,9,12,15,16],[2,3,6,9,12],[2,5,7,14,16],[2,7,8,10,15],[2,8,9,13,15],[3,4,14,15,16],[3,7,8,11,13],[3,10,11,12,15],[4,5,6,10,14],[4,5,7,12,13],[4,5,8,11,16],[4,7,9,10,11],[6,7,9,11,14],[6,9,10,13,16]];  // 16碼版 3-if-5：20注（貪婪+剪枝，已驗證 C(16,5)=4368 組全覆蓋）
const WHEEL15 = [[1,2,3,4,6],[5,7,8,9,10],[11,12,13,14,15],[1,2,5,7,11],[3,4,8,9,12],[6,10,13,14,15],[1,2,8,13,14],[3,4,5,7,15],[3,6,9,10,11],[1,2,4,10,12],[5,6,7,9,12],[4,6,8,11,15],[1,2,9,13,14],[3,5,7,13,14],[1,4,5,7,11],[1,2,3,8,12]];
function wheelSuggest(){
  // 覆蓋度票源與 GC 立柱一致（現役全策略、不含G0）；同票用 dual 分數分勝負（與 GC 取小號不同），取前15碼
  const {g1,g3,g5,g6,g8,g9,g10,g11}=allGroups();
  const cnt={};
  [g1,g3,g5,g6,g8,g9,g10,g11].filter(Boolean).forEach(g=>g.nums.forEach(n=>cnt[n]=(cnt[n]||0)+1));
  const all=Array.from({length:39},(_,i)=>i+1);
  const {dualFn}=buildDual(all);
  return all.sort((a,b)=>(cnt[b]||0)-(cnt[a]||0)||dualFn(b)-dualFn(a)).slice(0,15).sort((a,b)=>a-b);
}
function buildWheel(){

    </div>

}

// G11 冷門組合（2026-07-15，與 fetch gen_g11 一致）：dual 50%＋冷門度 50%，保底3碼≥32
function unpopScore(n){
  let s=40;
  if(n>=32) s+=35;
  if(n>12) s+=15;
  if(n%10===4) s+=10;
  if([3,6,7,8,9,18,28,38].includes(n)) s-=25;
  return s;
}
function genG11(){
  const pool=Array.from({length:39},(_,i)=>i+1);
  const {dualFn}=buildDual(pool);
  const dmax=Math.max(...pool.map(dualFn))||0.01;
  const umax=Math.max(...pool.map(unpopScore));
  const score=n=>(dualFn(n)/dmax)*50+(unpopScore(n)/umax)*50;
  const picks=[...pool].sort((a,b)=>score(b)-score(a)).slice(0,PICK_N);
  const high=picks.filter(n=>n>=32);
  if(high.length<3){
    const subs=pool.filter(n=>n>=32&&!picks.includes(n)).sort((a,b)=>score(b)-score(a)).slice(0,3-high.length);
    const lows=picks.filter(n=>n<32).sort((a,b)=>score(a)-score(b));
    for(const c of subs){ picks.splice(picks.indexOf(lows.shift()),1); picks.push(c); }
  }
  return {nums:picks.sort((a,b)=>a-b)};
}
// GC 覆蓋度立柱（2026-07-19，與 fetch gen_gc 一致）：現役策略投票（不含G0）前10碼，順序＝覆蓋度高→低、同票取小號
function genGC(strats){
  const cov={};
  for(const [k,nums] of Object.entries(strats)){ if(k==='G0'||!nums) continue; for(const n of nums) cov[n]=(cov[n]||0)+1; }
  const nums=Object.keys(cov).map(Number).sort((a,b)=>a-b).sort((a,b)=>cov[b]-cov[a]).slice(0,10);
  return {nums, cov};
}

function allGroups() {
  const groups={cand:candidates()};
  const cand=groups.cand;
  Object.assign(groups, {g1:genG1(cand), g3:genG3(cand), g5:genG5(cand), g6:genG6(cand), g8:genG8(cand), g9:genG9(), g10:genG10(), g11:genG11()});
  const s={};
  for(const [k,v] of Object.entries(groups)){ if(k!=='cand'&&v&&v.nums) s[k.toUpperCase()]=v.nums; }
  groups.gc=genGC(s);
  return groups;
}

function calcExcludeZone() {
  const POOL=39,PICK=5,EXCL=15;
  const all=Array.from({length:POOL},(_,i)=>i+1);
  const ZLbl={1:'一區 1–9',2:'二區 10–19',3:'三區 20–29',4:'四區 30–39'};
  if(rec.length<5) return{exclude:all.slice(0,EXCL),score:()=>50,S1:()=>50,S2:()=>50,S3:()=>50,btAvoid:null,theorAvoid:((POOL-EXCL)/POOL*100).toFixed(1),BT:0,zHeat:{1:1,2:1,3:1,4:1},hotZone:1,ZLbl,markovTop:[],lastNums:[]};
  // S1: 近期高頻
  const f5=new Array(POOL+1).fill(0),f10=new Array(POOL+1).fill(0),f20=new Array(POOL+1).fill(0);
  rec.slice(0,Math.min(5,rec.length)).forEach(r=>r.n.forEach(n=>f5[n]++));
  rec.slice(0,Math.min(10,rec.length)).forEach(r=>r.n.forEach(n=>f10[n]++));
  rec.slice(0,Math.min(20,rec.length)).forEach(r=>r.n.forEach(n=>f20[n]++));
  const fr=n=>f5[n]*3.0+f10[n]*1.5+f20[n]*0.8;
  const frMax=Math.max(...all.map(fr),0.01);
  const S1=n=>fr(n)/frMax*100;
  // S2: 區間輪動
  const zoneSz={1:0,2:0,3:0,4:0};all.forEach(n=>zoneSz[Z(n)]++);
  const rNz=Math.min(10,rec.length);const zCnt={1:0,2:0,3:0,4:0};
  rec.slice(0,rNz).forEach(r=>r.n.forEach(n=>zCnt[Z(n)]++));
  const zHeat={};[1,2,3,4].forEach(z=>{const e=rNz*PICK*zoneSz[z]/POOL;zHeat[z]=e>0?+(zCnt[z]/e).toFixed(2):1;});
  const zHMax=Math.max(...Object.values(zHeat),0.01);
  const S2=n=>zHeat[Z(n)]/zHMax*100;
  // S3: 馬可夫鏈（反向）
  const lastNums=rec[0]?.n||[];
  const mfSum=new Array(POOL+1).fill(0);let mfOpp=0;
  lastNums.forEach(prev=>{if(conStat[prev]&&conStat[prev].total>0){const t=conStat[prev].total;all.forEach(m=>{mfSum[m]+=((conStat[prev].followedBy[m]||0)+1)/(t+POOL);});mfOpp++;}});
  const mfRaw=n=>mfOpp>0?mfSum[n]/mfOpp:0;
  const mfMax=Math.max(...all.map(mfRaw),0.001);
  const S3=n=>(1-mfRaw(n)/mfMax)*100;
  // 加權合成 40%/30%/30%
  const combined=n=>S2(n)*0.7+S3(n)*0.3;  // 馬可夫樣本不足，Laplace收縮+降權
  const cMax=Math.max(...all.map(combined),0.01);
  const exclude=[...all].sort((a,b)=>combined(b)-combined(a)).slice(0,EXCL);
  // 回測：walk-forward，與線上排除同公式（S2 區間輪動70% + S3 反馬可夫30%）
  // 2026-07-20 修正：舊版回測用「近頻55%+區間45%」，測的不是線上模型
  const BT=Math.min(30,rec.length-21);let outside=0,total=0;
  for(let i=0;i<BT;i++){
    const past=rec.slice(i+1);
    const rNzb=Math.min(10,past.length);const bzCnt={1:0,2:0,3:0,4:0};
    past.slice(0,rNzb).forEach(r=>r.n.forEach(n=>bzCnt[Z(n)]++));
    const bzH={};[1,2,3,4].forEach(z=>{const e=rNzb*PICK*zoneSz[z]/POOL;bzH[z]=e>0?+(bzCnt[z]/e).toFixed(2):1;});
    const bzMax=Math.max(...Object.values(bzH),0.01);
    const bS2=n=>bzH[Z(n)]/bzMax*100;
    const bCon=buildConStat(past);
    const bLast=past[0]?.n||[];
    const bmf=new Array(POOL+1).fill(0);let bOpp=0;
    bLast.forEach(prev=>{if(bCon[prev]&&bCon[prev].total>0){const t=bCon[prev].total;all.forEach(m=>{bmf[m]+=((bCon[prev].followedBy[m]||0)+1)/(t+POOL);});bOpp++;}});
    const bRaw=n=>bOpp>0?bmf[n]/bOpp:0;
    const bMax=Math.max(...all.map(bRaw),0.001);
    const bS3=n=>(1-bRaw(n)/bMax)*100;
    const bsc=n=>bS2(n)*0.7+bS3(n)*0.3;
    const ex=[...all].sort((a,b)=>bsc(b)-bsc(a)).slice(0,EXCL);
    rec[i].n.forEach(n=>{if(!ex.includes(n))outside++;total++;});
  }
  const btAvoid=BT>0?(outside/total*100).toFixed(1):null;
  const theorAvoid=((POOL-EXCL)/POOL*100).toFixed(1);
  const hotZone=+Object.entries(zHeat).sort((a,b)=>b[1]-a[1])[0][0];
  const markovTop=mfOpp>0?[...all].sort((a,b)=>mfRaw(b)-mfRaw(a)).slice(0,5):[];
  return{exclude,score:n=>Math.round(combined(n)/cMax*100),S1,S2,S3,btAvoid,theorAvoid,BT,zHeat,hotZone,ZLbl,markovTop,lastNums};
}

// 回算第 i 期抽獎前，號碼 n 的沉寂期數
function dormancyBefore(i, n) {
  for(let j=i+1; j<rec.length; j++) {
    if(rec[j].n.includes(n)) return j-i-1;
  }
  return rec.length-i-1;
}

function toggleRptDetail(id) {

  if(el) el.style.display = el.style.display==='none'?'table-row':'none';

function buildReportForIdx(idx) {
  const r = rec[idx];
  if (!r) return null;
  const sorted = [...r.n].sort((a,b)=>a-b);
  const drawn = sorted.map(n => {
    const abBefore = dormancyBefore(idx, n);
    const ratio = +(abBefore / (st[n]?.ag || 8)).toFixed(2);
    return {n, abBefore, ratio};
  });
  const zd = {1:0,2:0,3:0,4:0};
  sorted.forEach(n => zd[Z(n)]++);
  const repeatNums = rec[idx+1] ? sorted.filter(n => rec[idx+1].n.includes(n)) : [];
  return {period: r.p, nums: sorted, drawn, zoneDist: zd, repeatNums, idx};
}

// ── 💼 固定投資盤：回歸前2名＋逾期（不含超期）＋動態3中保證輪盤 ──
const FX_MAX=39, FX_PICK=5;
const fxCost = t => `${t} 注 × 50 元 = ${t*50} 元/期`;
const FX_MODES=[
  {id:'eco',name:'💰 節約盤',k:2,lo:7,hi:9,excl:true, tag:'池最小、每期成本最低（使用者原始規則）'},
  {id:'bal',name:'⚖️ 平衡盤',k:3,lo:5,hi:9,excl:false,tag:'池中等、發動率與成本折衷'},
  {id:'max',name:'🚀 衝發動率盤',k:5,lo:6,hi:9,excl:false,tag:'池最大、發動最頻繁但成本最高'}];
function fxMode(){ const id=lsGet('539fxMode'); return FX_MODES.find(m=>m.id===id)||FX_MODES[0]; }
function setFxMode(id){ lsSet('539fxMode',id); render(); }
function fixedPool(){
  const m=fxMode();
  const dist=buildReturnDist(rec);
  const topGaps=Object.entries(dist).sort((a,b)=>b[1]-a[1]||(+a[0])-(+b[0])).slice(0,m.k).map(e=>+e[0]);
  const ret=[],over=[];
  for(let n=1;n<=FX_MAX;n++){
    const s=st[n]; if(!s||!s.ag) continue;
    if(m.excl&&s.ab/s.ag>=2) continue;             // 超期（≥2×平均間隔）排除（節約盤）
    if(topGaps.includes(s.ab)) ret.push(n);        // 沉寂期數命中回歸排名前K間隔
    else if(s.ab>=m.lo&&s.ab<=m.hi) over.push(n);  // 逾期區間
  }
  return {mode:m,topGaps,ret,over,pool:[...ret,...over].sort((a,b)=>a-b)};
}
// 三檔模式的歷史發動率即時回測（out-of-sample：每期只用該期之前的紀錄建池），記憶化避免重算
let FX_BT=null;
function fxBacktest(){
  if(FX_BT&&FX_BT.n===rec.length) return FX_BT;
  const MINH=60, chron=[...rec].reverse();  // 舊→新
  const res={}; FX_MODES.forEach(m=>res[m.id]={hit:0,tested:0,poolSum:0});
  const dist={}, last={}, tot={}, cnt={};
  for(let t=0;t<chron.length;t++){
    if(t>=MINH){
      const gapsSorted=Object.entries(dist).sort((a,b)=>b[1]-a[1]||(+a[0])-(+b[0]));
      for(const m of FX_MODES){
        const topGaps=gapsSorted.slice(0,m.k).map(e=>+e[0]);
        const pool=new Set();
        for(let n=1;n<=FX_MAX;n++){
          if(last[n]===undefined||!cnt[n]) continue;
          const ag=tot[n]/cnt[n]; if(!ag) continue;
          const ab=t-last[n]-1;
          if(m.excl&&ab/ag>=2) continue;
          if(topGaps.includes(ab)) pool.add(n);
          else if(ab>=m.lo&&ab<=m.hi) pool.add(n);
        }
        const r=res[m.id]; r.tested++; r.poolSum+=pool.size;
        if(chron[t].n.every(x=>pool.has(x))) r.hit++;
      }
    }
    for(const n of chron[t].n){
      if(last[n]!==undefined){ const g=t-last[n]-1; dist[g]=(dist[g]||0)+1; tot[n]=(tot[n]||0)+g; cnt[n]=(cnt[n]||0)+1; }
      last[n]=t;
    }
  }
  FX_BT={n:rec.length,res};
  return FX_BT;
}
function fxNote(m){
  const r=fxBacktest().res[m.id];
  if(!r||!r.tested) return m.tag+'｜歷史資料不足，暫無回測';
  const pct=r.hit/r.tested*100;
  const rate=r.hit>0?`${pct.toFixed(pct<1?2:1)}%（約每 ${Math.round(r.tested/r.hit)} 期一次）`:'0%（回測期間未發動）';
  return `${r.tested}期回測發動率 ${rate}｜池平均 ${(r.poolSum/r.tested).toFixed(0)} 碼｜${m.tag}（數字隨每期開獎自動重算）`;
}
function fxComb(n,k){ if(k<0||k>n) return 0; let r=1; for(let i=0;i<k;i++) r=r*(n-i)/(i+1); return Math.round(r); }
function fxPop(x){ x=x-((x>>1)&0x55555555); x=(x&0x33333333)+((x>>2)&0x33333333); return (((x+(x>>4))&0x0f0f0f0f)*0x01010101)>>24; }
function fixedWheelGen(pool){
  const N=pool.length, K=FX_PICK;
  if(N<K) return {err:`池只有 ${N} 碼，至少需要 ${K} 碼才能投注`};
  if(N<=K+1) return {tickets:[pool.slice(0,K)],verified:true,combos:fxComb(N,K)};
  if(N>31) return {err:`池有 ${N} 碼，超過動態輪盤上限 31 碼（等池縮小或改用其他打法）`};
  const total=fxComb(N,K);
  if(total>500000) return {err:`池 ${N} 碼的開獎組合數 ${total.toLocaleString()} 過大，瀏覽器無法即時演算（請改用池較小的模式）`};
  const combos=new Int32Array(total);
  { const idx=Array.from({length:K},(_,i)=>i); let ptr=0;
    while(true){
      let m=0; for(const i of idx) m|=1<<i;
      combos[ptr++]=m;
      let i=K-1;
      while(i>=0&&idx[i]===N-K+i) i--;
      if(i<0) break;
      idx[i]++; for(let j=i+1;j<K;j++) idx[j]=idx[j-1]+1;
    } }
  const covered=new Uint8Array(total);
  let unc=total;
  const tickets=[];
  let seed=((rec[0]?.p||1)>>>0)%2147483647; pool.forEach(n=>seed=(seed*31+n)%2147483647); if(seed<=0) seed=1;
  const rnd=()=>((seed=seed*48271%2147483647)-1)/2147483646;
  while(unc>0){
    const sampU=[];
    if(unc<=3000){ for(let i=0;i<total;i++) if(!covered[i]) sampU.push(i); }
    else { let tries=0; while(sampU.length<2500&&tries<25000){ const i=(rnd()*total)|0; if(!covered[i]) sampU.push(i); tries++; }
      if(!sampU.length){ for(let i=0;i<total&&sampU.length<2500;i++) if(!covered[i]) sampU.push(i); } }
    const nc=Math.min(600,sampU.length), cands=[];
    for(let c=0;c<nc;c++) cands.push(combos[sampU[(rnd()*sampU.length)|0]]);
    let best=cands[0],bestScore=-1;
    for(const t of cands){ let s=0; for(const i of sampU){ if(fxPop(t&combos[i])>=3) s++; } if(s>bestScore){bestScore=s;best=t;} }
    tickets.push(best);
    for(let i=0;i<total;i++){ if(!covered[i]&&fxPop(best&combos[i])>=3){covered[i]=1;unc--;} }
  }
  // 剪枝：移除多餘票（覆蓋計數法；池過大時跳過以免手機卡頓）
  if(total<=250000){
    const cnt=new Uint8Array(total);
    for(const t of tickets) for(let i=0;i<total;i++){ if(fxPop(t&combos[i])>=3&&cnt[i]<255) cnt[i]++; }
    for(let k=tickets.length-1;k>=0;k--){
      const t=tickets[k]; let removable=true;
      for(let i=0;i<total;i++){ if(fxPop(t&combos[i])>=3&&cnt[i]<2){removable=false;break;} }
      if(removable){ for(let i=0;i<total;i++){ if(fxPop(t&combos[i])>=3) cnt[i]--; } tickets.splice(k,1); }
    }
  }
  // 窮舉驗證：每一種可能開獎組合都至少被一注覆蓋 ≥3 碼
  let verified=true;
  for(let i=0;i<total;i++){ let ok=false; for(const t of tickets){ if(fxPop(t&combos[i])>=3){ok=true;break;} } if(!ok){verified=false;break;} }
  const asNums=tickets.map(m=>{ const a=[]; for(let i=0;i<N;i++) if(m&(1<<i)) a.push(pool[i]); return a; });
  return {tickets:asNums,verified,combos:total};
}
function buildFixedWheel(){
  const out=document.getElementById('fx-out'); if(!out) return;
  out.innerHTML='<div style="font-size:.8rem;color:var(--muted);padding:6px 0">⏳ 貪婪覆蓋演算＋窮舉驗證中…</div>';

// ── RENDER: ANNUAL ─────────────────────────────────────────
function renderAnnual(el){
  const A=ANNUAL, T=A.periods;
  const freq=A.freq;
  const firstP=A.firstP, lastP=A.lastP;
  const maxF=Math.max(...freq.slice(1));
  const expF=+(T*5/39).toFixed(1);

  // sorted ranking
  const ranking=Array.from({length:39},(_,i)=>i+1).sort((a,b)=>freq[b]-freq[a]);

  // tail bias sorted
  const tailSorted=Object.entries(A.tailBias).sort((a,b)=>b[1]-a[1]);

  // color helpers
  const freqClr=f=>f>=25?'#dc2626':f>=20?'#d97706':f<=13?'#2563eb':f<=16?'#64748b':'var(--text)';
  const biasClr=b=>b>=15?'#dc2626':b>=8?'#d97706':b<=-15?'#2563eb':b<=-8?'#64748b':'var(--text)';
  const biasBg=b=>b>=15?'#fee2e2':b>=8?'#fef3c7':b<=-15?'#dbeafe':b<=-8?'#e0e7ff':'';

  el.innerHTML=`
  <div class="card">
    <h3>📈 年度開獎規律（${firstP}–${lastP}，共${T}期）</h3>
    <div class="zone-grid" style="margin-bottom:12px">
      ${(()=>{const hotN=A.hotNum,hotF=freq[hotN];const coldTail=Object.entries(A.tailBias).reduce((a,b)=>+b[1]<+a[1]?b:a);return `
      <div class="zone-box" style="background:#fee2e2"><div class="val" style="color:#dc2626">${String(hotN).padStart(2,'0')}</div><div class="lbl">年度最熱號</div></div>
      <div class="zone-box" style="background:#fef3c7"><div class="val" style="color:#d97706">${A.consecRate}%</div><div class="lbl">每期含連號率</div></div>
      <div class="zone-box" style="background:#dcfce7"><div class="val" style="color:#16a34a">${A.avgSum}</div><div class="lbl">平均號碼總和</div></div>
      <div class="zone-box" style="background:#dbeafe"><div class="val" style="color:#2563eb">尾${coldTail[0]}</div><div class="lbl">最冷尾數(${coldTail[1]}%)</div></div>`;})()}
    </div>
    <div style="font-size:.78rem;color:var(--muted)">理論期望：每號每期出現機率 5/39 = 12.82%，${T}期理論出現次數 ≈ <strong>${expF}</strong> 次</div>
  </div>

  <div class="card">
    <h3>🔥 號碼年度熱冷排行（全39號）</h3>
    <div style="font-size:.75rem;color:var(--muted);margin-bottom:10px">紅色=超頻熱號 / 藍色=欠頻冷號 / 理論值 ${expF} 次</div>
    ${ranking.map((n,i)=>{
      const f=freq[n], diff=f-expF, pct=+((f/expF-1)*100).toFixed(0);
      const barW=Math.min((f/maxF)*100,100);
      const clr=freqClr(f);
      return `<div class="num-row">
        <span style="color:var(--muted);width:20px;font-size:.75rem;text-align:right">${i+1}</span>
        ${ball(n,'ball-sm')}
        <div style="flex:1;margin:0 8px">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px">
            <span style="font-size:.85rem;font-weight:700;color:${clr}">${f}次</span>
            <span style="font-size:.72rem;color:${clr}">${diff>=0?'+':''}${diff>=0?'+':''} ${pct>0?'+':''}${pct}%</span>
            ${f>=25?'<span class="tag tag-hot">熱</span>':f<=13?'<span class="tag tag-cold">冷</span>':''}
          </div>
          <div class="bar-wrap"><div class="bar-fill" style="width:${barW}%;background:${clr}"></div></div>
        </div>
      </div>`;
    }).join('')}
  </div>

  <div class="card">
    <h3>🎯 尾數年度偏移（選號核心規律）</h3>
    <div style="font-size:.75rem;color:var(--muted);margin-bottom:10px">尾0 因只有3個號碼（10,20,30），理論期望較低（${+(T*5*3/39).toFixed(1)}次 vs 其他尾數${+(T*5*4/39).toFixed(1)}次）</div>
    <table>
      <thead><tr>${thSort('ann-tail','ti','尾數')}${thSort('ann-tail','actual',(1911+Math.floor(rec[0].p/1000))+'實際')}<th>理論值</th>${thSort('ann-tail','bias','年度偏差')}<th>對應號碼</th><th>選號建議</th></tr></thead>
      <tbody>${applySort(Object.entries(A.tailBias).map(([t,bias])=>{const ti=+t;const nums=Array.from({length:39},(_,i)=>i+1).filter(n=>n%10===ti);return {ti,bias,actual:nums.reduce((s,n)=>s+freq[n],0),nums};}), 'ann-tail','bias','desc').map(({ti,bias,actual,nums})=>{
        const exp=ti===0?+(T*5*3/39).toFixed(1):+(T*5*4/39).toFixed(1);
        const clr=biasClr(bias);
        const bg=biasBg(bias);
        return `<tr style="background:${bg}">
          <td><strong style="font-size:1.1rem;color:${clr}">尾${ti}</strong></td>
          <td style="text-align:center;font-weight:700;color:${clr}">${actual}</td>
          <td style="text-align:center;color:var(--muted)">${exp}</td>
          <td style="text-align:center;font-weight:700;color:${clr}">${bias>0?'+':''}${bias}%</td>
          <td style="font-size:.75rem;color:var(--muted)">${nums.map(f2).join(', ')}</td>
          <td style="font-size:.75rem">${bias>=15?'🔥強烈推薦':bias>=8?'✅ 推薦':bias<=-15?'🚫 迴避':bias<=-8?'⚠️ 謹慎':'➡️ 中性'}</td>

function backtestGroups() {
  const {g1,g3,g5,g6,g8,g9,g10} = allGroups();
  const grps = [
    {key:'G1', label:'📅年度熱號', g:g1},
    {key:'G3', label:'⚖️均衡區間', g:g3},

    {key:'G8', label:'🎰年度+動能', g:g8},
    {key:'G9', label:'🔁回歸熱區', g:g9},
    {key:'G10', label:'🧬回歸+超期', g:g10},
  ];
  const draws = rec.slice(0, rec.length);
  return grps.map(({key,label,g}) => {
    if(!g) return {key, label, valid:false};
    const mc = draws.map(r => g.nums.filter(n => r.n.includes(n)).length);
    const total = mc.length;
    const avg = total ? +(mc.reduce((a,b)=>a+b,0)/total).toFixed(2) : 0;
    const randExp = +(g.nums.length*5/39).toFixed(2);
    const hit1cnt = mc.filter(m=>m>=1).length;
    return {key, label, nums:g.nums, avg, randExp,
      hit3: mc.filter(m=>m>=3).length, hit2: mc.filter(m=>m>=2).length,
      hit1: hit1cnt, winRate: total ? +(hit1cnt/total*100).toFixed(0) : 0,
      maxM: total?Math.max(...mc):0, total, valid:true};
  });
}

function pNorm(z){
  const t=1/(1+0.2316419*Math.abs(z));
  const p=1-(1/Math.sqrt(2*Math.PI))*Math.exp(-z*z/2)*t*(0.319381530+t*(-0.356563782+t*(1.781477937+t*(-1.821255978+t*1.330274429))));
  return z>=0?p:1-p;
}
function statsFromVals(vals,mu0){
  const n=vals.length;
  if(n<3) return null;
  const mean=vals.reduce((a,b)=>a+b,0)/n;
  const variance=n>1?vals.reduce((a,b)=>a+(b-mean)**2,0)/(n-1):0;
  const std=Math.sqrt(variance);
  const se=std/Math.sqrt(n);
  const tCrit=n>=30?1.96:n>=20?2.09:n>=15?2.14:n>=10?2.23:n>=5?2.57:3.18;
  const ci=[+(mean-tCrit*se).toFixed(2),+(mean+tCrit*se).toFixed(2)];
  const tStat=std<0.001?0:(mean-mu0)/se;
  const pval=+(2*(1-pNorm(Math.abs(tStat)))).toFixed(3);
  const nNeeded=std>0&&Math.abs(mean-mu0)>0.01?Math.min(500,Math.ceil(Math.pow(2.80*std/Math.abs(mean-mu0),2))):null;
  return{mean:+mean.toFixed(2),std:+std.toFixed(2),ci,pval,nNeeded};
}

function rollingBacktestAll() {
  const POOL=39,DRAW=5,PICK=PICK_N;
  const Zfn=n=>n<=9?1:n<=19?2:n<=29?3:4;
  const all=Array.from({length:POOL},(_,i)=>i+1);
  const BT=Math.min(50,rec.length-30);
  if(BT<5) return null;
  const H={G1:[],G3:[],G5:[],G6:[],G8:[],G9:[],G10:[]};
  for(let i=0;i<BT;i++){
    const tr=rec.slice(i+1);
    if(tr.length<20) continue;
    const actual=rec[i].n;
    const freq=new Array(POOL+2).fill(0);
    tr.forEach(r=>r.n.forEach(n=>{if(n>=1&&n<=POOL)freq[n]++;}));
    const periods=tr.length,annMax=Math.max(...all.map(n=>freq[n]),1);
    const tExp=DRAW/POOL*periods,tFreq=new Array(10).fill(0);
    tr.forEach(r=>r.n.forEach(n=>tFreq[n%10]++));
    const tBias=tFreq.map(f=>+(((f/tExp)-1)*100).toFixed(0)),tBMax=Math.max(...tBias.map(Math.abs),1);
    const rN=Math.min(30,tr.length),rf=new Array(POOL+2).fill(0);
    tr.slice(0,rN).forEach(r=>r.n.forEach(n=>{if(n<=POOL)rf[n]++;}));
    const momFn=n=>{const e=freq[n]/periods;return e<0.001?0:(rf[n]/rN)/e;};
    const annFn=n=>(freq[n]/annMax)*70+Math.max(0,tBias[n%10]||0)/tBMax*30;
    const s3max=Math.max(...all.map(annFn),0.01),momMax=Math.max(...all.map(momFn),0.01);
    const dualFn=n=>(annFn(n)/s3max)*60+(momFn(n)/momMax)*40;
    const gIdx=new Array(POOL+2).fill(tr.length);
    for(let j=0;j<tr.length;j++){tr[j].n.forEach(n=>{if(n<=POOL&&gIdx[n]===tr.length)gIdx[n]=j;});if(all.every(n=>gIdx[n]<tr.length))break;}
    const gapFn=n=>gIdx[n];
    H.G1.push([...all].sort((a,b)=>freq[b]-freq[a]).slice(0,PICK).filter(n=>actual.includes(n)).length);
    const byZ={};for(let z=1;z<=4;z++) byZ[z]=[...all.filter(n=>Zfn(n)===z)].sort((a,b)=>dualFn(b)-dualFn(a));
    let g3p=[...byZ[1].slice(0,3),...byZ[2].slice(0,3),...byZ[3].slice(0,3)];
    if(g3p.length<PICK) g3p=[...g3p,...byZ[4]].filter((n,i,a)=>a.indexOf(n)===i);
    H.G3.push(g3p.sort((a,b)=>dualFn(b)-dualFn(a)).slice(0,PICK).filter(n=>actual.includes(n)).length);
    const chiT=tFreq.reduce((a,f,t)=>{const e=periods*DRAW*((t===0?3:4))/POOL;return a+(e>0?Math.pow(f-e,2)/e:0);},0);
    const hotT=chiT>=16.92?tBias.map((b,t)=>b>=8?t:-1).filter(t=>t>=0):[];
    let g5pick;
    if(!hotT.length){ g5pick=[...all].sort((a,b)=>dualFn(b)-dualFn(a)).slice(0,PICK); }
    else{
      const hpAll=[...all.filter(n=>hotT.includes(n%10))].sort((a,b)=>dualFn(b)-dualFn(a));
      const cpAll=[...all.filter(n=>!hotT.includes(n%10))].sort((a,b)=>dualFn(b)-dualFn(a));
      const hpk=hpAll.slice(0,Math.min(PICK-2,hpAll.length));
      g5pick=[...hpk,...cpAll.filter(n=>!hpk.includes(n)).slice(0,PICK-hpk.length)].slice(0,PICK);
    }
    H.G5.push(g5pick.filter(n=>actual.includes(n)).length);
    H.G6.push([...all].sort((a,b)=>gapFn(b)-gapFn(a)).slice(0,PICK).filter(n=>actual.includes(n)).length);
    const g8fn=n=>(annFn(n)/s3max)*60+(momFn(n)/momMax)*40;
    H.G8.push([...all].sort((a,b)=>g8fn(b)-g8fn(a)).slice(0,PICK).filter(n=>actual.includes(n)).length);
    const rDist=buildReturnDist(tr);
    const rTop3=Object.entries(rDist).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([g])=>+g);
    let g9p=all.filter(n=>rTop3.includes(gapFn(n)));
    if(!g9p.length) g9p=all;
    H.G9.push([...g9p].sort((a,b)=>dualFn(b)-dualFn(a)).slice(0,PICK).filter(n=>actual.includes(n)).length);
    const rTotal=Object.values(rDist).reduce((a,b)=>a+b,0)||1;
    const rHot=new Set(Object.entries(rDist).filter(([,c])=>c/rTotal>0.11).map(([g])=>+g));
    const agT={},agC={},agL={};
    for(let j=tr.length-1;j>=0;j--){const pos=tr.length-1-j;tr[j].n.forEach(n=>{if(agL[n]!==undefined){agT[n]=(agT[n]||0)+(pos-agL[n]-1);agC[n]=(agC[n]||0)+1;}agL[n]=pos;});}
    const agFn=n=>agC[n]?agT[n]/agC[n]:POOL/DRAW;
    const pA=all.filter(n=>rHot.has(gapFn(n))).sort((a,b)=>dualFn(b)-dualFn(a));
    const pB=all.filter(n=>gapFn(n)>=2*agFn(n)).sort((a,b)=>dualFn(b)-dualFn(a));
    const g10p=pA.slice(0,PICK-2);
    for(const pool of [pB, pA.slice(PICK-2), [...all].sort((a,b)=>dualFn(b)-dualFn(a))])
      for(const n of pool){ if(g10p.length>=PICK)break; if(!g10p.includes(n))g10p.push(n); }
    H.G10.push(g10p.slice(0,PICK).filter(n=>actual.includes(n)).length);
  }
  const randExp=+(PICK*DRAW/POOL).toFixed(2);
  const res={randExp,BT:H.G1.length};
  for(const k of ['G1','G3','G5','G6','G8','G9','G10']){
    const h=H[k];if(!h.length){res[k]={avg:null,excess:null};continue;}
    const avg=+(h.reduce((a,b)=>a+b,0)/h.length).toFixed(2);
    res[k]={avg,excess:+(avg-randExp).toFixed(2)};
  }
  return res;
}

function renderTrack(el) {
  const bt = backtestGroups();

  const logAvg = {};
  gKeys.forEach(k => {
    const rel = pickLog.filter(l => l.hits && l.hits[k] !== undefined);
    if(rel.length) logAvg[k] = +(rel.reduce((a,l)=>a+l.hits[k],0)/rel.length).toFixed(2);
  });
  // 期望逐筆計算：選碼數×5/39（2026-07-12 擴至8碼前的舊紀錄為5碼，混合時代仍可合併檢定）
  const expOfEntry=(l,k)=>((l.strategies&&l.strategies[k])?l.strategies[k].length:5)*5/39;
  const perfRows=gKeys.map(k=>{
    const rel=pickLog.filter(l=>l.hits&&l.hits[k]!==undefined);
    const n=rel.length,vals=rel.map(l=>l.hits[k]);
    const excessVals=rel.map(l=>l.hits[k]-expOfEntry(l,k));
    const tot=vals.reduce((a,b)=>a+b,0);
    const avg=n>0?+(tot/n).toFixed(2):null;
    const excess=n>0?+(excessVals.reduce((a,b)=>a+b,0)/n).toFixed(2):null;
    const stat=n>=3?statsFromVals(excessVals,0):null;
    return{k,n,tot,avg,excess,ci:stat?.ci??null,pval:stat?.pval??null,nNeeded:stat?.nNeeded??null};

  const mTests=perfRows.filter(r=>r.n>0&&r.k!=='G0').length||1;

  <div class="card">
    <h3>📊 策略近期回測（當前選號 vs 近 ${N} 期開獎）</h3>
    <div class="alert alert-blue" style="font-size:.76rem;margin-bottom:10px">
      ⓘ 說明：以「當前狀態」生成的選號與全部 ${N} 期歷史開獎比對。數字越多代表策略在歷史上命中率越高。G4因選超期號天生偏低，請以實際押注紀錄為準。
    </div>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>策略</th><th>本期選號</th>${thSort('trk-bt','avg','平均命中')}<th>超額</th>${thSort('trk-bt','winRate','勝率%')}${thSort('trk-bt','hit2','2碼+')}${thSort('trk-bt','hit3','3碼+')}${thSort('trk-bt','maxM','最高')}<th>評估</th></tr></thead>
      <tbody>${applySort(bt,'trk-bt','avg','desc').map(g => {
        if(!g.valid) return `<tr><td colspan="10" style="color:var(--muted);font-size:.78rem">${g.label} — 候選號碼不足</td></tr>`;
        const grade = g.avg>=1.5?'優秀':g.avg>=1.0?'良好':g.avg>=0.6?'普通':'偏低';
        const clr = g.avg>=1.5?'#dc2626':g.avg>=1.0?'#d97706':g.avg>=0.6?'var(--muted)':'#2563eb';
        const ex=+(g.avg-g.randExp).toFixed(2);
        const exClr=ex>0.05?'#16a34a':ex>-0.05?'#d97706':'#dc2626';
        return `<tr>
          <td style="font-size:.78rem;font-weight:600">${g.label}</td>
          <td style="font-size:.68rem;color:var(--muted)">${g.nums.map(f2).join(' ')}</td>
          <td style="text-align:center;font-weight:700;color:${clr}">${g.avg}</td>
          <td style="text-align:center;font-size:.8rem;font-weight:700;color:${exClr}">${ex>=0?'+':''}${ex}</td>
          <td style="text-align:center;font-size:.8rem;font-weight:600;color:${g.winRate>=60?'#16a34a':g.winRate>=45?'#d97706':'#94a3b8'}">${g.winRate}%</td>
          <td style="text-align:center;font-size:.8rem">${g.hit2}/${g.total}</td>
          <td style="text-align:center;font-size:.8rem">${g.hit3}/${g.total}</td>
          <td style="text-align:center">${g.maxM}</td>
          <td><span class="tag ${g.avg>=1.5?'tag-hot':g.avg>=1.0?'tag-warn':'tag-gray'}">${grade}</span></td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>
    <div style="font-size:.72rem;color:var(--muted);margin-top:8px">隨機基準：每8碼選號平均命中 ≈ 1.03碼 ｜ 超額 = 平均 − 隨機基準（依各組選碼數計）</div>
    <div style="font-size:.7rem;color:#d97706;margin-top:4px">⚠️ 此回測以「當前模型」對全部歷史資料比對，存在資料洩漏，數字偏樂觀。請以上方「真實績效排行」為主要參考依據。</div>
  </div>

  <div class="card">
    <h3>⏱️ 回歸期數排名</h3>
    <p style="font-size:.78rem;color:var(--muted);margin-bottom:8px">統計所有歷史號碼被開出後，間隔幾期再次出現的次數分佈。次數越多代表該回歸間隔在歷史上最常發生。</p>
    ${(() => {
      const dist = buildReturnDist(rec);
      const total = Object.values(dist).reduce((a,b)=>a+b,0);
      if(!total) return '<div style="color:var(--muted);font-size:.82rem">資料不足</div>';
      const rows = Object.entries(dist)
        .map(([gap,cnt])=>({gap:+gap, cnt, pct:+(cnt/total*100).toFixed(1)}))
        .sort((a,b)=>b.cnt-a.cnt);
      const maxCnt = rows[0].cnt;
      let cumCnt = 0;
      return `<div style="overflow-x:auto"><table>
        <thead><tr><th>名次</th><th>回歸期數</th><th>次數</th><th>佔比</th><th>累積%</th><th>分佈</th></tr></thead>
        <tbody>${rows.slice(0,20).map((r,i)=>{
          cumCnt += r.cnt;
          const barW = Math.round(r.cnt/maxCnt*80);
          const clr = i===0?'#dc2626':i<3?'#d97706':i<8?'#16a34a':'#94a3b8';
          return `<tr>
            <td style="text-align:center;color:var(--muted);font-size:.75rem">${i+1}</td>
            <td style="text-align:center;font-weight:700">間隔 ${r.gap} 期${r.gap===0?' 🔁':''}</td>
            <td style="text-align:center;font-weight:700;color:${clr}">${r.cnt}</td>
            <td style="text-align:center">${r.pct}%</td>
            <td style="text-align:center;color:var(--muted);font-size:.75rem">${(cumCnt/total*100).toFixed(1)}%</td>
            <td><div style="background:${clr};height:8px;border-radius:4px;width:${barW}px;min-width:2px"></div></td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>
      <div style="font-size:.7rem;color:var(--muted);margin-top:6px">共統計 ${total} 次回歸事件，顯示次數最高的前 20 個間隔。注意：間隔分佈遞減是獨立開獎下幾何分佈的自然形狀，見下方平坦度檢驗。</div>`;
    })()}
  </div>

  <div class="card" style="border-left:4px solid #7c3aed">
    <h3>📏 回歸機率平坦度檢驗（賭徒謬誤照妖鏡）</h3>
    <p style="font-size:.78rem;color:var(--muted);margin-bottom:8px">檢驗「沉寂越久越該回歸」：沉寂 g 期的號碼，下一期回歸的實際機率。若各深度都貼近理論值 12.8%（虛線），代表回歸機率與沉寂多久無關。</p>
    ${(()=>{
      const dist=buildReturnDist(rec);
      const expP=5/39*100;
      const rows=[];
      for(let g=0;g<=14;g++){
        const atRisk=Object.entries(dist).reduce((a,[k,c])=>a+((+k>=g)?c:0),0);
        if(atRisk<20) break;
        const h=(dist[g]||0)/atRisk*100;
        const se=Math.sqrt(expP/100*(1-expP/100)/atRisk)*100;
        rows.push({g,atRisk,h,lo:expP-2*se,hi:expP+2*se});
      }
      if(rows.length<4) return '<div style="color:var(--muted);font-size:.82rem">資料不足</div>';
      const outliers=rows.filter(r=>r.h<r.lo||r.h>r.hi).length;
      const maxH=Math.max(...rows.map(r=>r.h),expP)*1.25;
      const barH=v=>Math.max(2,v/maxH*90);
      return `<div style="position:relative;height:112px">
        <div style="position:absolute;left:0;right:0;bottom:${barH(expP)}px;border-top:2px dashed #dc2626;z-index:2"><span style="position:absolute;right:2px;top:-15px;font-size:.62rem;color:#dc2626;font-weight:700">理論 ${expP.toFixed(1)}%</span></div>
        <div style="display:flex;align-items:flex-end;gap:3px;height:112px">
        ${rows.map(r=>{
          const out=r.h<r.lo||r.h>r.hi;
          return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%">
            <span style="font-size:.56rem;color:${out?'#dc2626':'var(--muted)'}">${r.h.toFixed(0)}</span>
            <div style="width:72%;background:${out?'#dc2626':'#7c3aed'};opacity:.8;height:${barH(r.h)}px;border-radius:3px 3px 0 0"></div>
          </div>`;
        }).join('')}
        </div>
      </div>
      <div style="display:flex;gap:3px;margin-top:2px">${rows.map(r=>`<div style="flex:1;text-align:center;font-size:.58rem;color:var(--muted)">${r.g}</div>`).join('')}</div>
      <div style="text-align:center;font-size:.62rem;color:var(--muted);margin-bottom:6px">← 沉寂深度 g（期）→（每根柱下方為 g，柱高＝該深度下一期回歸機率%）</div>
      <div style="font-size:.74rem;padding:7px 10px;background:${outliers<=1?'#f0fdf4':'#fef9c3'};border-radius:6px">
        ${outliers<=1
          ?`✅ <strong>各沉寂深度的回歸機率均貼近理論值</strong>（${rows.length} 個深度僅 ${outliers} 個超出 ±2σ，屬正常波動）——「沉寂越久越該回歸」在本資料中<strong>不成立</strong>，這是每期獨立開獎的直接證據。號碼不會「記得」自己沉寂多久。`
          :`⚠️ ${rows.length} 個深度中有 ${outliers} 個超出 ±2σ（紅柱）。深度越深樣本越少、波動越大，多屬隨機起伏，不建議視為可下注的訊號。`}
      </div>`;
    })()}
  </div>

  <div class="card">
    <h3>🏆 歷史押注命中紀錄（${pickLog.length} 筆）</h3>
    ${logHTML}
  </div>`;
}

// ── RENDER: SETTINGS ───────────────────────────────────────

// ── RENDER: COMPANION ──────────────────────────────────────
function renderCompanion(el) {
  const pairs = buildPairStat();
  const total = rec.length;
  const randExp = +(total * 2 / (39 * 38 / 2) * C2_ADJ()).toFixed(1);

  function C2_ADJ() { return 5*4/2; } // 每期 C(5,2)=10 個 pair

  // 排行榜
  const topPairs = Object.entries(pairs)
    .map(([k,cnt]) => { const [a,b]=k.split('-').map(Number); return {a,b,cnt,pct:+(cnt/total*100).toFixed(1)}; })
    .sort((x,y)=>y.cnt-x.cnt).slice(0,20);

  // 單號查詢
  const companions = Array.from({length:39},(_,i)=>i+1)
    .filter(n=>n!==compNum)
    .map(n => {
      const k = compNum<n?`${compNum}-${n}`:`${n}-${compNum}`;
      return {n, cnt:pairs[k]||0, pct:+((pairs[k]||0)/total*100).toFixed(1)};
    }).sort((a,b)=>b.cnt-a.cnt);

  const maxCnt = topPairs[0]?.cnt || 1;
  const randLine = +(total*10/(39*38/2)).toFixed(1);

  el.innerHTML = `
  <div class="card">
    <h3>🤝 高頻同伴排行 TOP 20（共 ${total} 期）</h3>
    <div style="font-size:.78rem;color:var(--muted);margin-bottom:10px">同一期同時出現次數最多的號碼對，隨機期望 ≈ ${randLine} 次</div>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>#</th><th>號碼對</th><th style="text-align:center">共現次數</th><th style="text-align:center">頻率</th><th>相對強度</th></tr></thead>
      <tbody>${topPairs.map(({a,b,cnt,pct},i)=>`
        <tr>
          <td style="color:var(--muted);font-size:.75rem">${i+1}</td>
          <td>${ball(a,'ball-sm')} ${ball(b,'ball-sm')}</td>
          <td style="font-weight:700;text-align:center">${cnt}</td>
          <td style="text-align:center;color:var(--muted);font-size:.8rem">${pct}%</td>
          <td style="min-width:80px"><div class="bar-wrap"><div class="bar-fill" style="width:${cnt/maxCnt*100}%;background:var(--primary)"></div></div></td>
        </tr>`).join('')}
      </tbody>
    </table></div>
  </div>

  <div class="card">
    <h3>🔍 單號同伴查詢</h3>
    <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px">
      ${Array.from({length:39},(_,i)=>i+1).map(n=>`
        <span onclick="compNum=${n};renderCompanion(document.getElementById('content'))"
          class="ball ball-sm ${ZC[Z(n)]}"
          style="cursor:pointer;outline:${compNum===n?'2.5px solid #1e293b':'2px solid transparent'};outline-offset:1px">${f2(n)}</span>`).join('')}
    </div>
    <div style="font-size:.85rem;font-weight:700;margin-bottom:8px">
      ${ball(compNum,'ball-sm')} 號碼 ${f2(compNum)} 的同伴頻率（前 10 名）
    </div>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>同伴</th><th style="text-align:center">同期次數</th><th style="text-align:center">頻率</th><th>強度</th></tr></thead>
      <tbody>${companions.slice(0,10).map(({n,cnt,pct})=>`
        <tr>
          <td>${ball(n,'ball-sm')}</td>
          <td style="font-weight:700;text-align:center">${cnt}</td>
          <td style="text-align:center;font-size:.8rem;color:var(--muted)">${pct}%</td>
          <td style="min-width:80px"><div class="bar-wrap"><div class="bar-fill" style="width:${companions[0].cnt?cnt/companions[0].cnt*100:0}%;background:var(--z2)"></div></div></td>
        </tr>`).join('')}
      </tbody>
    </table></div>
    <div style="font-size:.72rem;color:var(--muted);margin-top:8px">隨機期望 ≈ ${randLine} 次（${total} 期 × 理論同現機率）</div>
  </div>`;
}

function applyStats(){
  const raw=document.getElementById('st-paste').value.trim();
  if(!raw) return;
  let cnt=0;
  raw.split('\n').forEach(line=>{
    const p=line.trim().split(/\s+/).map(Number);
    if(p.length>=9){
      const [num,mg,ag,mc,ab,tt,t20,t50,t100]=p;
      if(num>=1&&num<=39){ st[num]={mg,ag,mc,ab,tt,t20,t50,t100}; cnt++; }
    }
  });
  save();
  alert(`已更新 ${cnt} 個號碼`);
  render();
}

function resetAll(){
  if(!confirm('確認重設全部資料回預設值？\n（含開獎紀錄、統計、押注紀錄）')) return;
  rec=JSON.parse(JSON.stringify(BASE_REC));
  st=JSON.parse(JSON.stringify(BASE_ST));
  retHist={};
  conStat=buildConStat(rec);
  pendingPick=null;
  pickLog=[];
  savePickLog();
  save();
  lastReport=null;
  updateHdr();
  alert(`✅ 已重設完成！\n資料截至第 ${rec[0].p} 期，共 ${rec.length} 筆開獎紀錄。\n押注紀錄已清空。`);
  go('pick');
}

// ── ADD DRAW ───────────────────────────────────────────────
function addDraw(){
  const pv=parseInt(document.getElementById('inp-period').value);
  const ni=[...document.querySelectorAll('.ni')];
  const nums=ni.map(i=>parseInt(i.value)).filter(n=>n>=1&&n<=39);

  if(!pv||pv<100000){ alert('請輸入有效期號（6位數）'); return; }
  if(nums.length!==5){ alert('請輸入5個 01–39 的號碼'); return; }
  if(new Set(nums).size!==5){ alert('號碼不可重複'); return; }
  if(rec[0]&&pv<=rec[0].p){ alert(`期號需大於目前最新期（${rec[0].p}）`); return; }

  const sorted=nums.sort((a,b)=>a-b);

  // snapshot pre-update stats for report
  const drawn=sorted.map(n=>({n,abBefore:st[n]?st[n].ab:0,ratio:od(n)}));
  const zd={1:0,2:0,3:0,4:0}; sorted.forEach(n=>{zd[Z(n)]++;});

  // record return history BEFORE updating absent counts
  sorted.forEach(n => {
    const gap = st[n] ? st[n].ab : 0;
    if (!retHist[n]) retHist[n] = [];
    retHist[n].push({period: pv, gap});
  });

  // record consecutive stat: prev draw → current draw
  const repeatNums = [];
  if (rec.length > 0) {
    const prev = rec[0].n;
    prev.forEach(n => {
      if (!conStat[n]) conStat[n] = {total:0, repeats:0, followedBy:{}};
      conStat[n].total++;
      if (sorted.includes(n)) { conStat[n].repeats++; repeatNums.push(n); }
      sorted.forEach(m => { conStat[n].followedBy[m] = (conStat[n].followedBy[m]||0)+1; });
    });
  }

  // update stats
  for(let n=1;n<=39;n++){
    if(!st[n]) continue;
    st[n].ab = sorted.includes(n) ? 0 : st[n].ab+1;
  }

  // check pending pick against this draw result
  if(pendingPick) {
    const hits = {};
    const hitNums = {};
    for(const [k,nums] of Object.entries(pendingPick.strategies)) {
      const matched = nums.filter(n => sorted.includes(n));
      hits[k] = matched.length;
      hitNums[k] = matched;
    }
    const excHits=pendingPick.excluded?sorted.filter(n=>pendingPick.excluded.includes(n)).length:null;
    pickLog.unshift({period:pv, strategies:pendingPick.strategies, result:sorted, hits, hitNums, excludedHits:excHits, excluded:pendingPick.excluded, ts:pendingPick.ts});
    pendingPick = null;
    savePickLog();
  }

  // add record
  rec.unshift({p:pv,n:sorted});
  ANNUAL = buildAnnual(rec);
  save();

  lastReport={period:pv,nums:sorted,drawn,zoneDist:zd,repeatNums};

  // clear inputs
  document.getElementById('inp-period').value='';
  ni.forEach(i=>{i.value='';});

  updateHdr();
  go('pick');
}

// ── KEYBOARD SHORTCUTS ─────────────────────────────────────
document.getElementById('inp-period').addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key==='\t') document.querySelectorAll('.ni')[0].focus();
});
document.querySelectorAll('.ni').forEach((inp,i,all)=>{
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter') i<all.length-1 ? all[i+1].focus() : addDraw();
  });
  inp.addEventListener('input',()=>{
    if(inp.value.length>=2&&i<all.length-1) all[i+1].focus();
  });
});

// ── HEADER ─────────────────────────────────────────────────
function updateHdr(){
  const r=rec[0];
  document.getElementById('hdr-info').innerHTML=r
    ?`最新：第 ${r.p} 期<br>${r.n.map(f2).join(' ')}`
    :'尚無紀錄';
}

// ── INIT ───────────────────────────────────────────────────
load();
updateHdr();
render();
</script>
