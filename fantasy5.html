<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CA Fantasy 5 分析</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍀%3C/text%3E%3C/svg%3E">
<style>
:root {
  --bg: #f0f4f8;
  --card: #ffffff;
  --primary: #16a34a;
  --primary-dk: #15803d;
  --text: #1e293b;
  --muted: #64748b;
  --border: #e2e8f0;
  --z1: #2563eb; --z1-bg: #dbeafe;
  --z2: #16a34a; --z2-bg: #dcfce7;
  --z3: #ea580c; --z3-bg: #ffedd5;
  --z4: #dc2626; --z4-bg: #fee2e2;
  --od: #9333ea; --od-bg: #f3e8ff;
  --warn: #d97706; --warn-bg: #fef3c7;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* Header */
header { background: var(--primary); color: #fff; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
header h1 { font-size: 1.1rem; font-weight: 700; }
#hdr-info { font-size: .78rem; opacity: .85; text-align: right; line-height: 1.5; }

/* Input */
.input-card { background: var(--card); margin: 12px; border-radius: 12px; padding: 14px 16px; box-shadow: 0 1px 4px rgba(0,0,0,.07); }
.input-card h2 { font-size: .82rem; font-weight: 600; color: var(--muted); margin-bottom: 10px; }
.input-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
input[type=number] { border: 1.5px solid var(--border); border-radius: 8px; padding: 8px 6px; font-size: .95rem; text-align: center; width: 60px; outline: none; -moz-appearance: textfield; }
input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
input[type=number]:focus { border-color: var(--primary); }
#inp-period { width: 90px; }
.num-wrap { display: flex; gap: 5px; }
.btn { background: var(--primary); color: #fff; border: none; border-radius: 8px; padding: 9px 16px; font-size: .88rem; font-weight: 600; cursor: pointer; white-space: nowrap; transition: background .15s; }
.btn:hover { background: var(--primary-dk); }
.btn-gray { background: #94a3b8; }
.btn-gray:hover { background: #64748b; }
.btn-red { background: #dc2626; }
.btn-red:hover { background: #b91c1c; }

/* Tabs */
.tabs { display: flex; background: var(--card); border-bottom: 1px solid var(--border); overflow-x: auto; padding: 0 12px; }
.tab-btn { border: none; background: none; padding: 11px 14px; font-size: .83rem; font-weight: 500; color: var(--muted); cursor: pointer; border-bottom: 2.5px solid transparent; white-space: nowrap; transition: all .15s; }
.tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 700; }

/* Content */
#content { padding: 12px; max-width: 760px; margin: 0 auto; }

/* Card */
.card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
.card h3 { font-size: .93rem; font-weight: 700; margin-bottom: 12px; }
.sec-lbl { font-size: .72rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }

/* Balls */
.ball { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%; font-size: .82rem; font-weight: 700; margin: 2px; flex-shrink: 0; }
.ball-sm { width: 26px; height: 26px; font-size: .72rem; margin: 1px; }
.z1 { background: var(--z1-bg); color: var(--z1); }
.z2 { background: var(--z2-bg); color: var(--z2); }
.z3 { background: var(--z3-bg); color: var(--z3); }
.z4 { background: var(--z4-bg); color: var(--z4); }
.zx { background: #f1f5f9; color: #94a3b8; }

/* Tags */
.tag { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 20px; font-size: .72rem; font-weight: 600; }
.tag-hot { background: #fee2e2; color: #dc2626; }
.tag-cold { background: #dbeafe; color: #2563eb; }
.tag-od { background: var(--od-bg); color: var(--od); }
.tag-warn { background: var(--warn-bg); color: var(--warn); }
.tag-ok { background: #dcfce7; color: #16a34a; }
.tag-gray { background: #f1f5f9; color: var(--muted); }

/* Tables */
table { width: 100%; border-collapse: collapse; font-size: .83rem; }
th { text-align: left; padding: 7px 8px; color: var(--muted); font-weight: 600; border-bottom: 1.5px solid var(--border); font-size: .75rem; }
td { padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: none; }

/* Alerts */
.alert { border-radius: 8px; padding: 10px 12px; font-size: .83rem; margin-bottom: 8px; line-height: 1.6; }
.alert-danger { background: #fee2e2; color: #991b1b; }
.alert-warn { background: var(--warn-bg); color: #92400e; }
.alert-od { background: var(--od-bg); color: #6b21a8; }
.alert-ok { background: #dcfce7; color: #166534; }
.alert-blue { background: #dbeafe; color: #1e40af; }

/* Group cards */
.grp { border: 1.5px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 10px; }
.grp-title { font-size: .9rem; font-weight: 700; margin-bottom: 10px; }
.grp-nums { display: flex; gap: 2px; flex-wrap: wrap; margin-bottom: 8px; }
.grp-meta { font-size: .79rem; color: var(--muted); line-height: 1.7; }
.verify-row { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }

/* Stats */
.zone-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
.zone-box { border-radius: 8px; padding: 10px 8px; text-align: center; }
.zone-box .val { font-size: 1.4rem; font-weight: 700; }
.zone-box .lbl { font-size: .7rem; color: var(--muted); margin-top: 2px; }

/* Tail grid */
.tail-grid { display: grid; grid-template-columns: repeat(5,1fr); gap: 6px; }
.tail-cell { border-radius: 8px; padding: 8px 4px; text-align: center; background: var(--bg); }
.tail-cell .tv { font-size: 1.1rem; font-weight: 700; }
.tail-cell .tl { font-size: .68rem; color: var(--muted); margin-top: 2px; }
.bar-wrap { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 5px; }
.bar-fill { height: 100%; border-radius: 3px; }

/* Num row */
.num-row { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border); }
.num-row:last-child { border-bottom: none; }

/* OD bar */
.od-bar { flex: 1; }
.od-label { min-width: 44px; text-align: right; font-size: .8rem; font-weight: 700; }

/* Empty */
.empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: .88rem; }

/* Settings textarea */
textarea { width: 100%; height: 180px; font-family: monospace; font-size: .78rem; border: 1.5px solid var(--border); border-radius: 8px; padding: 10px; resize: vertical; outline: none; }
textarea:focus { border-color: var(--primary); }

@media (max-width: 480px) {
  .ret-tbl th, .ret-tbl td { padding: 6px 4px; font-size: .72rem; }
  .ret-tbl td { white-space: nowrap; }
  .ret-tbl th { white-space: normal !important; line-height: 1.25; vertical-align: bottom; }
  .ret-tbl .ret-diff { display: block; }
  .ret-tbl .ball-sm { width: 24px; height: 24px; font-size: .7rem; }
  .zone-grid { grid-template-columns: repeat(2,1fr); }
  .input-row { flex-direction: column; align-items: flex-start; }
  .num-wrap { flex-wrap: wrap; max-width: 100%; }
}
</style>
</head>
<body>

<header>
  <h1>🌟 CA Fantasy 5 分析</h1>
  <div id="hdr-info">載入中…</div>
</header>

<div class="input-card">
  <h2>＋ 輸入最新開獎號碼</h2>
  <div class="input-row">
    <input id="inp-period" type="number" placeholder="Draw #" />
    <div class="num-wrap">
      <input class="ni" type="number" min="1" max="39" placeholder="01" />
      <input class="ni" type="number" min="1" max="39" placeholder="02" />
      <input class="ni" type="number" min="1" max="39" placeholder="03" />
      <input class="ni" type="number" min="1" max="39" placeholder="04" />
      <input class="ni" type="number" min="1" max="39" placeholder="05" />
    </div>
    <button class="btn" onclick="addDraw()">送出 → 快報</button>
  </div>
</div>

<nav class="tabs">
  <button class="tab-btn" onclick="go('report')">📋 快報</button>
  <button class="tab-btn active" onclick="go('pick')">🎯 選號</button>
  <button class="tab-btn" onclick="go('annual')">📈 年度規律</button>
  <button class="tab-btn" onclick="go('stats')">📊 統計</button>
  <button class="tab-btn" onclick="go('records')">📜 紀錄</button>
  <button class="tab-btn" onclick="go('settings')">⚙️ 設定</button>
  <button class="tab-btn" onclick="go('track')">🏆 中獎追蹤</button>
  <button class="tab-btn" onclick="go('companion')">🤝 同伴</button>
</nav>

<main id="content"></main>

<script>document.write('<script src="data_f5.js?v=' + Date.now() + '"><\/script>');</script>
<script>
// ── CONSTANTS ──────────────────────────────────────────────
const Z = n => n<=9?1:n<=19?2:n<=29?3:4;
const ZN = ['','一區 01-09','二區 10-19','三區 20-29','四區 30-39'];
const ZL = ['','一區','二區','三區','四區'];
const ZC = ['','z1','z2','z3','z4'];
const f2 = n => String(n).padStart(2,'0');


// ── STORAGE ────────────────────────────────────────────────
let rec = [], st = {}, retHist = {}, conStat = {}, ANNUAL = null;

// 期號→開獎日期（2026-11-27 鈞洋要求「每期都要有日期，不要只有期號」）
// 從 BASE_REC 查：瀏覽器 localStorage 存的舊 rec 沒有 dt 也查得到；手動輸入、查不到的期數回空字串
let _dtMap = null;
function dtOf(p) {
  if (!_dtMap) {
    _dtMap = {};
    (typeof BASE_REC !== 'undefined' ? BASE_REC : []).forEach(r => { if (r.dt) _dtMap[r.p] = r.dt; });
  }
  if (!_dtMap[p]) { const r = (rec || []).find(x => x.p == p && x.dt); if (r) _dtMap[p] = r.dt; }
  return _dtMap[p] || '';
}
// full=true → 2026/11/26（四）；否則 11/26（四）
function dtTag(p, full) {
  const d = dtOf(p); if (!d) return '';
  const wd = '日一二三四五六'[new Date(d + 'T00:00:00').getDay()];
  return (full ? d.replace(/-/g, '/') : d.slice(5).replace('-', '/')) + '（' + wd + '）';
}
let pendingPick = null;  // {strategies:{G1:[...], ...}, ts: timestamp}
let pickLog = [];        // [{period, strategies, result, hits, ts}]
let compNum = 8;         // 同伴分析選中的號碼
// retHist[num] = [{period, gap}, ...]
// conStat[num] = {total, repeats, followedBy:{m:count,...}}
//   total      = times num appeared as "previous draw" predecessor
//   repeats    = times num also appeared in the very next draw (連莊)
//   followedBy = for each number m, how many times m appeared in the next draw after num

function buildRetHistFromRec(records, maxN) {
  const rh = {};
  const ordered = [...records].reverse();
  const firstSeen = new Set();
  const absence = new Array(maxN+1).fill(0);
  for (const r of ordered) {
    for (let n=1; n<=maxN; n++) {
      if (r.n.includes(n)) {
        if (firstSeen.has(n)) {
          if (!rh[n]) rh[n] = [];
          rh[n].push({period: r.p, gap: absence[n]});
        }
        firstSeen.add(n);
        absence[n] = 0;
      } else if (firstSeen.has(n)) {
        absence[n]++;
      }
    }
  }
  return rh;
}

function buildConStat(records) {
  const s = {};
  const ordered = [...records].reverse(); // chronological
  for (let i = 0; i < ordered.length - 1; i++) {
    const prev = ordered[i].n, curr = ordered[i+1].n;
    prev.forEach(n => {
      if (!s[n]) s[n] = {total:0, repeats:0, followedBy:{}};
      s[n].total++;
      if (curr.includes(n)) s[n].repeats++;
      curr.forEach(m => { s[n].followedBy[m] = (s[n].followedBy[m]||0)+1; });
    });
  }
  return s;
}

function buildPairStat() {
  const pairs = {};
  rec.forEach(r => {
    const sorted = [...r.n].sort((a,b)=>a-b);
    for(let i=0;i<sorted.length-1;i++)
      for(let j=i+1;j<sorted.length;j++) {
        const k = `${sorted[i]}-${sorted[j]}`;
        pairs[k] = (pairs[k]||0)+1;
      }
  });
  return pairs;
}

function reconstructLastReport() {
  if (!rec[0]) return;
  const sorted = rec[0].n;
  const pv = rec[0].p;
  const drawn = sorted.map(n => {
    let abBefore = 0;
    for (let i = 1; i < rec.length; i++) {
      if (rec[i].n.includes(n)) { abBefore = i - 1; break; }
      abBefore = i;
    }
    return {n, abBefore, ratio: +(abBefore / avgGap(n)).toFixed(2)};
  });
  const zd = {1:0,2:0,3:0,4:0};
  sorted.forEach(n => {zd[Z(n)]++;});
  const repeatNums = rec[1] ? sorted.filter(n => rec[1].n.includes(n)) : [];
  lastReport = {period:pv, nums:sorted, drawn, zoneDist:zd, repeatNums, idx:0};
}

// localStorage 在 iOS file:// 下可能被封鎖，統一包 try/catch
function lsGet(k) { try { return localStorage.getItem(k); } catch(e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch(e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch(e) {} }

function load() {
  const r = lsGet('f5r');
  const s = lsGet('f5s');
  const h = lsGet('f5h');
  const storedRec = r ? JSON.parse(r) : null;
  // Auto-upgrade: if stored data is behind BASE_REC, reset to BASE_REC
  if (!storedRec || storedRec[0]?.p < BASE_REC[0].p) {
    rec     = JSON.parse(JSON.stringify(BASE_REC)); _dormTbl=null;
    st      = JSON.parse(JSON.stringify(BASE_ST));
    retHist = buildRetHistFromRec(rec, 39);
    conStat = buildConStat(rec);
    save();
  } else {
    rec     = storedRec; _dormTbl=null;
    st      = s ? JSON.parse(s) : JSON.parse(JSON.stringify(BASE_ST));
    const parsedH = h ? JSON.parse(h) : null;
    retHist = (parsedH && Object.keys(parsedH).length > 0) ? parsedH : buildRetHistFromRec(rec, 39);
    conStat = buildConStat(rec);
  }
  ANNUAL = buildAnnual(rec);
  loadPickLog();
  reconstructLastReport();
}
function save() {
  lsSet('f5r', JSON.stringify(rec));
  lsSet('f5s', JSON.stringify(st));
  lsSet('f5h', JSON.stringify(retHist));
}
function loadPickLog() {
  lsDel('f5pp');  // 手動鎖定已廢除（2026-08-09 減法重構）：pending 一律來自 Python 事前發布
  const l = lsGet('f5pl');
  pendingPick = BASE_PENDING ? JSON.parse(JSON.stringify(BASE_PENDING)) : null;
  // pickLog：BASE_PICKLOG 為基底，localStorage 追加未同步的紀錄
  const base = BASE_PICKLOG ? JSON.parse(JSON.stringify(BASE_PICKLOG)) : [];
  const local = l ? JSON.parse(l) : [];
  const basePeriods = new Set(base.map(e=>e.period));
  const extra = local.filter(e=>!basePeriods.has(e.period));
  pickLog = [...extra, ...base];
}
function savePickLog() {
  // pendingPick 不再持久化（一律來自 BASE_PENDING；2026-08-09）
  // 只存 BASE_PICKLOG 沒有的本地紀錄
  const basePeriods = new Set(BASE_PICKLOG.map(e=>e.period));
  lsSet('f5pl', JSON.stringify(pickLog.filter(e=>!basePeriods.has(e.period))));
}
// ── CORE ANALYSIS ──────────────────────────────────────────
const od   = n => st[n] ? +(st[n].ab / avgGap(n)).toFixed(2) : 0;

// candidates()＝全池，只供「近 10 期區間冷熱」等描述用；選號候選池由 pick_engine.py 產生（sfg-v5 三池），排除規則已退役
function candidates() { return Array.from({length:39},(_,i)=>i+1); }

function zoneCounts(sliceN=10) {
  const c={1:0,2:0,3:0,4:0};
  rec.slice(0,sliceN).forEach(r=>r.n.forEach(n=>{c[Z(n)]++;}));
  return c;
}

function hotCold(zc) {
  const maxODinZone = z => {
    const pool = candidates().filter(n=>Z(n)===z);
    return pool.length ? Math.max(...pool.map(od)) : 0;
  };
  const sorted = [1,2,3,4].sort((a,b)=>{
    if (zc[b]!==zc[a]) return zc[b]-zc[a];
    return maxODinZone(b)-maxODinZone(a);
  });
  return {hot:sorted[0], cold:sorted[3]};
}

function tailCounts(n=10) {
  const c={};
  for(let i=0;i<=9;i++) c[i]=0;
  rec.slice(0,n).forEach(r=>r.n.forEach(num=>{c[num%10]++;}));
  return c;
}

function buildReturnDist(records) {
  const dist = {};
  for(let i=records.length-1; i>=0; i--) {
    for(const n of records[i].n) {
      for(let j=i-1; j>=0; j--) {
        if(records[j].n.includes(n)) {
          const gap = i - j - 1;
          dist[gap] = (dist[gap] || 0) + 1;
          break;
        }
      }
    }
  }
  return dist;
}




// ── UI HELPERS ─────────────────────────────────────────────
const ball  = (n,sm='') => `<span class="ball ${sm} ${ZC[Z(n)]}">${f2(n)}</span>`;
const ballX = (n,sm='') => `<span class="ball ${sm} zx">${f2(n)}</span>`;

function odTag(n){
  const r=od(n);
  if(r>=2.0) return `<span class="tag tag-od">×${r}倍</span>`;
  if(r>=1.0) return `<span class="tag tag-warn">×${r}倍</span>`;
  return `<span class="tag tag-gray">×${r}倍</span>`;
}

function ck(ok,label){
  return `<span class="tag ${ok?'tag-ok':'tag-hot'}">${ok?'✅':'❌'} ${label}</span>`;
}

// ── TABS ───────────────────────────────────────────────────
let tab='pick', lastReport=null, rptMode=0, rptHistFilter='', selectedRptIdx=0;

// ── SORT HELPERS ───────────────────────────────────────────
const sortState = {};
function setSort(tid, col) {
  const s = sortState[tid];
  sortState[tid] = (s && s.col === col)
    ? {col, dir: s.dir === 'asc' ? 'desc' : 'asc'}
    : {col, dir: 'desc'};
}
function thSort(tid, col, label) {
  const s = sortState[tid];
  const active = s && s.col === col;
  const arr = active ? (s.dir === 'asc' ? '▲' : '▼') : '↕';
  return `<th onclick="setSort('${tid}','${col}');render()" style="cursor:pointer;user-select:none;white-space:nowrap">${label} <span style="font-size:.65em;color:${active?'#4ade80':'#64748b'}">${arr}</span></th>`;
}
function applySort(arr, tid, defCol, defDir) {
  const s = sortState[tid] || (defCol ? {col:defCol, dir:defDir||'desc'} : null);
  if (!s) return arr;
  return [...arr].sort((a, b) => {
    const va = a[s.col], vb = b[s.col];
    const cmp = typeof va === 'string' ? va.localeCompare(vb, 'zh-TW') : (va??0) - (vb??0);
    return s.dir === 'asc' ? cmp : -cmp;
  });
}

function go(t){
  tab=t;
  document.querySelectorAll('.tab-btn').forEach((b,i)=>{
    b.classList.toggle('active',['report','pick','annual','stats','records','settings','track','companion'][i]===t);
  });
  render();
}

function render(){
  loadHistFull();
  const el=document.getElementById('content');
  if(tab==='report')   renderReport(el);
  else if(tab==='pick') renderPick(el);
  else if(tab==='annual') renderAnnual(el);
  else if(tab==='stats') renderStats(el);
  else if(tab==='records') renderRecords(el);
  else if(tab==='track') renderTrack(el);
  else if(tab==='companion') renderCompanion(el);
  else renderSettings(el);
}

// ── RENDER: REPORT ─────────────────────────────────────────

// 回算第 i 期抽獎前，號碼 n 的沉寂期數
function dormancyBefore(i, n) {
  for(let j=i+1; j<rec.length; j++) {
    if(rec[j].n.includes(n)) return j-i-1;
  }
  return rec.length-i-1;
}


// ── 同沉寂期數對照（2026-08-18 鈞洋要求）───────────────────────
// 目的：每期開出的號碼各自沉寂了幾期，以及**同樣沉寂那麼多期、卻沒有開出**的其他號碼。
// 這是「沉寂深度到底有沒有預測力」最直觀的檢視：同一格裡有的開了、有的沒開。
// 預計算整張表，避免每格都跑一次 dormancyBefore（那是 O(期數)，會讓頁面卡住）。
let _dormTbl = null;
function dormancyTable() {
  if (_dormTbl) return _dormTbl;
  const MAXN = 39;
  const tbl = new Array(rec.length);
  const gap = {};
  for (let n = 1; n <= MAXN; n++) gap[n] = null;   // null = 在更舊的紀錄裡從未出現
  for (let i = rec.length - 1; i >= 0; i--) {      // rec 是新→舊，故由最舊往回推
    const cur = {};
    for (let n = 1; n <= MAXN; n++) cur[n] = (gap[n] === null) ? (rec.length - i - 1) : gap[n];
    tbl[i] = cur;
    for (let n = 1; n <= MAXN; n++) {
      if (rec[i].n.includes(n)) gap[n] = 0;
      else if (gap[n] !== null) gap[n] = gap[n] + 1;
    }
  }
  _dormTbl = tbl;
  return tbl;
}
// 第 i 期抽獎前，沉寂深度剛好等於 d、但該期**沒有**開出的號碼
function sameDormancyOthers(i, d) {
  const MAXN = 39;
  const t = dormancyTable()[i], drawn = rec[i].n, out = [];
  for (let n = 1; n <= MAXN; n++) {
    if (drawn.includes(n)) continue;
    if (t[n] === d) out.push(n);
  }
  return out;
}


// 產生「同沉寂期數對照」區塊。idx＝該期在 rec 的索引；items＝[{n, d 或 abBefore}]
// 三個地方共用：歷史查詢展開列、本期快報、歷史單期詳情。
function sameDormancyBlock(idx, items) {
  if (idx === undefined || idx === null || !rec[idx]) return '';
  const byD = {};
  items.forEach(x => {
    const d = (x.d !== undefined) ? x.d : x.abBefore;
    if (byD[d] === undefined) byD[d] = { drawn: [], others: sameDormancyOthers(idx, d) };
    byD[d].drawn.push(x.n);
  });
  const ds = Object.keys(byD).map(Number).sort((a, b) => a - b);
  return `<div style="border-top:1px dashed var(--border);padding-top:8px;margin-top:8px">
    <div style="font-size:.7rem;color:var(--muted);margin-bottom:5px;font-weight:600">
      🔍 同沉寂期數對照 — 一樣沉寂那麼久，誰開了、誰沒開
    </div>
    ${ds.map(d => {
      const g = byD[d], tot = g.drawn.length + g.others.length;
      const rate = (g.drawn.length / tot * 100).toFixed(0);
      return `<div style="background:#fff;padding:5px 8px;border-radius:7px;border:1px solid var(--border);margin-bottom:4px">
        <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:.7rem">
          <b style="color:#0f172a;white-space:nowrap">沉寂 ${d} 期</b>
          <span style="color:#16a34a">開出</span>
          ${g.drawn.map(n => `<span class="ball ball-sm ${ZC[Z(n)]}">${f2(n)}</span>`).join('')}
          ${g.others.length ? `<span style="color:var(--muted)">未開出</span>
            ${g.others.map(n => `<span class="ball ball-sm ${ZC[Z(n)]}" style="opacity:.35">${f2(n)}</span>`).join('')}`
            : `<span style="color:var(--muted)">（此深度沒有別的號碼）</span>`}
          <span style="margin-left:auto;color:#64748b;white-space:nowrap">
            ${tot} 碼中開 ${g.drawn.length} 碼 = <b>${rate}%</b></span>
        </div>
      </div>`;
    }).join('')}
    <div style="font-size:.66rem;color:var(--muted);margin-top:4px;line-height:1.6">
      ⚖️ 每個深度的開出率長期都會回到 <b>12.82%</b>（＝開出碼數／號池），與沉寂多久無關。
      單期的百分比是小樣本波動，不代表該深度比較容易開。
    </div>
  </div>`;
}

function buildReportForIdx(idx) {
  const r = rec[idx];
  if (!r) return null;
  const sorted = [...r.n].sort((a,b)=>a-b);
  const drawn = sorted.map(n => {
    const abBefore = dormancyBefore(idx, n);
    const ratio = +(abBefore / avgGap(n)).toFixed(2);
    return {n, abBefore, ratio};
  });
  const zd = {1:0,2:0,3:0,4:0};
  sorted.forEach(n => zd[Z(n)]++);
  const repeatNums = rec[idx+1] ? sorted.filter(n => rec[idx+1].n.includes(n)) : [];
  return {period: r.p, nums: sorted, drawn, zoneDist: zd, repeatNums, idx};
}

function observation(R,sOD){
  const lines=[];
  const zd=R.zoneDist;
  const zero=[1,2,3,4].filter(z=>zd[z]===0);
  if(zero.length) lines.push(`本期 ${zero.map(z=>ZL[z]).join('、')} 開出 0 碼。`);
  const maxZ=[1,2,3,4].reduce((a,b)=>zd[a]>zd[b]?a:b);
  if(zd[maxZ]>=3) lines.push(`${ZL[maxZ]} 本期開出 ${zd[maxZ]} 碼。`);
  if(sOD.length) lines.push(`沉寂較久：${sOD.slice(0,3).map(n=>`${f2(n)}（×${od(n)}倍）`).join('、')} 目前已超過 2 倍平均間隔（僅描述，每期獨立）。`);
  if(!lines.length) lines.push('本期走勢平穩，無特殊異常，可參考選號分析。');
  return lines.join('<br>');
}

// ── RENDER: STATS ──────────────────────────────────────────
// 全歷史平均間隔＋逾期倍數（2026-11-27 鈞洋要求）
// 口徑：歷史檔 history_f5.json ＋ 目前 rec 合併去重、依期號排序；間隔＝兩次開出之間沒開的期數（同回歸統計的沉寂定義）
// 僅描述性：每期獨立開獎，逾期倍數高不代表下期較易開出（2026-08-16 全歷史回測已驗證），不可當選號依據
let _histFull = null, _histFullLoading = false;
function loadHistFull() {
  if (_histFull || _histFullLoading) return;
  _histFullLoading = true;
  fetch('history_f5.json?v=20260716').then(r => r.json()).then(h => {
    const key = r => r.p != null ? +r.p : (r.draw ? +String(r.draw).replace('/', '') : null);
    const m = new Map();
    for (const r of h) { const k = key(r); if (k != null) m.set(k, r.n); }
    for (const r of rec) m.set(+r.p, r.n);
    const ps = [...m.keys()].sort((a, b) => a - b);
    const last = new Array(39+1).fill(-1), sum = new Array(39+1).fill(0), cnt = new Array(39+1).fill(0), mx = new Array(39+1).fill(0);
    ps.forEach((k, i) => { for (const n of m.get(k)) { if (last[n] >= 0) { const g = i - last[n] - 1; sum[n] += g; cnt[n]++; if (g > mx[n]) mx[n] = g; } last[n] = i; } });
    const res = { draws: ps.length, from: ps[0], to: ps[ps.length-1], avg: {}, cur: {}, max: {} };
    for (let n = 1; n <= 39; n++) { res.avg[n] = cnt[n] ? sum[n] / cnt[n] : null; res.cur[n] = last[n] >= 0 ? ps.length - 1 - last[n] : null; res.max[n] = cnt[n] ? mx[n] : null; }
    _histFull = res;
    if (typeof reconstructLastReport === 'function') reconstructLastReport();  // 逾期倍數改用全歷史重算
    if (['stats','report','settings','pick'].includes(tab)) render();
  }).catch(() => { _histFull = { err: true }; if (['stats','report','settings'].includes(tab)) render(); });
}

// 平均間隔／最大間隔（2026-11-27 起取代 BASE_ST 的 ag/mg——那兩個欄位 7 月初後就沒再更新）
// 全歷史載入前先用網頁紀錄 rec 的回歸間隔頂著；定義一律＝兩次開出之間沒開的期數
function _recGaps(n) { const h = retHist[n]; return h && h.length ? h.map(x => x.gap) : []; }
function avgGap(n) {
  if (_histFull && !_histFull.err && _histFull.avg[n] != null) return _histFull.avg[n];
  const g = _recGaps(n); return g.length ? g.reduce((a, b) => a + b, 0) / g.length : 6.8;
}
function maxGap(n) {
  if (_histFull && !_histFull.err && _histFull.max[n] != null) return _histFull.max[n];
  const g = _recGaps(n); return g.length ? Math.max(...g) : null;
}

// ── RENDER: TRACK ──────────────────────────────────────────
function pNorm(z){
  const t=1/(1+0.2316419*Math.abs(z));
  const p=1-(1/Math.sqrt(2*Math.PI))*Math.exp(-z*z/2)*t*(0.319381530+t*(-0.356563782+t*(1.781477937+t*(-1.821255978+t*1.330274429))));
  return z>=0?p:1-p;
}
function statsFromVals(vals,mu0){
  const n=vals.length;
  if(n<3) return null;
  const mean=vals.reduce((a,b)=>a+b,0)/n;
  const variance=n>1?vals.reduce((a,b)=>a+(b-mean)**2,0)/(n-1):0;
  const std=Math.sqrt(variance);
  const se=std/Math.sqrt(n);
  const tCrit=n>=30?1.96:n>=20?2.09:n>=15?2.14:n>=10?2.23:n>=5?2.57:3.18;
  const ci=[+(mean-tCrit*se).toFixed(2),+(mean+tCrit*se).toFixed(2)];
  const tStat=std<0.001?0:(mean-mu0)/se;
  const pval=+(2*(1-pNorm(Math.abs(tStat)))).toFixed(3);
  const nNeeded=std>0&&Math.abs(mean-mu0)>0.01?Math.min(500,Math.ceil(Math.pow(2.80*std/Math.abs(mean-mu0),2))):null;
  return{mean:+mean.toFixed(2),std:+std.toFixed(2),ci,pval,nNeeded};
}

          ${ks.map(k=>{
            const h=l.hits?l.hits[k]:undefined;
            if(h===undefined) return '';
            const hn=new Set((l.hitNums&&l.hitNums[k])||((l.strategies[k]||[]).filter(n=>(l.result||[]).includes(n))));
            const clr=h>=3?'#dc2626':h>=2?'#d97706':h>=1?'#16a34a':'#94a3b8';
            const numStr=(l.strategies[k]||[]).map(n=>hn.has(n)?`<b style="color:#16a34a">${f2(n)}</b>`:`<span style="color:#94a3b8;font-size:.85em">${f2(n)}</span>`).join(' ');
            return `<div style="background:#f8fafc;border:1px solid var(--border);border-radius:7px;padding:4px 8px">
              <span style="font-size:.75rem;color:var(--muted)">${gLabel(k)}</span>
              <span style="font-size:.76rem;margin:0 4px">${numStr}</span>
              <b style="color:${clr};font-size:.76rem">${h}✓</b>
            </div>`;
          }).join('')}
        </div>
      </div>`;
    }).join('') + (pickLog.length>20?`<button onclick="window._logAll=!window._logAll;render()" class="btn btn-gray" style="font-size:.8rem;padding:6px 12px;margin:0 6px 8px 0">${window._logAll?'只看最近 20 期':`顯示全部 ${pickLog.length} 期`}</button>`:'') + `<button onclick="if(confirm('確認清空本機追加的紀錄？（BASE_PICKLOG 內建紀錄不受影響）')){pickLog=pickLog.filter(l=>BASE_PICKLOG.some(b=>b.period===l.period));savePickLog();render();}" class="btn btn-red" style="margin-top:4px;font-size:.75rem;padding:5px 12px">清空本機追加紀錄</button>`;

  el.innerHTML = `
  <div class="card" style="border-top:4px solid #16a34a">
    <h3>📊 4 組選號真實績效（out-of-sample 自動兌獎）</h3>
    ${v2Log.length===0
      ?`<div class="alert alert-blue" style="font-size:.82rem">新制（4 組 × 3 碼）尚無結算紀錄，開獎後自動累積。</div>`
      :`<div style="overflow-x:auto"><table>
        <thead><tr><th>組</th><th>N</th><th>平均/期</th><th>超額</th><th>95%CI</th><th>中2+</th><th>中3</th><th>p值</th></tr></thead>
        <tbody>${v2Rows.map(r=>{
          const exClr=r.ex>0.05?'#16a34a':r.ex>-0.05?'#d97706':'#dc2626';
          return `<tr>
            <td style="font-weight:700">${r.k} 組</td>
            <td style="text-align:center">${r.n}</td>
            <td style="text-align:center;font-weight:700">${r.avg}</td>
            <td style="text-align:center;font-weight:700;color:${exClr}">${r.ex>=0?'+':''}${r.ex}</td>
            <td style="text-align:center;font-size:.72rem;color:var(--muted)">${r.ci?`[${r.ci[0]}, ${r.ci[1]}]`:'—'}</td>
            <td style="text-align:center">${r.h2}</td>
            <td style="text-align:center;color:#dc2626;font-weight:700">${r.h3}</td>
            <td style="text-align:center;font-size:.74rem">${r.pval!==null?`p=${r.pval}`:'—'}</td>
          </tr>`;}).join('')}</tbody>
      </table></div>
      <div style="font-size:.7rem;color:var(--muted);margin-top:6px">隨機期望 ${E2} 碼/組/期（3×${PICK}/${POOL}）｜超額＝平均−期望｜p 值未做多重比較校正：三彩種共 12 組同時檢定，單一 p&lt;0.05 偶然出現的機會很高（Bonferroni 門檻約 0.004）｜誠實揭露：長期而言超額應收斂於 0——本表存在的目的正是驗證這件事</div>`}
  </div>

  <div class="card">
    <h3>🔒 本期預測狀態</h3>
    ${pendHTML}
  </div>

  <div class="card">
    <h3>⏱️ 回歸期數排名</h3>
    <p style="font-size:.78rem;color:var(--muted);margin-bottom:8px">統計所有歷史號碼被開出後，間隔幾期再次出現的次數分佈。次數越多代表該回歸間隔在歷史上最常發生。</p>
    ${(() => {
      const dist = buildReturnDist(rec);
      const total = Object.values(dist).reduce((a,b)=>a+b,0);
      if(!total) return '<div style="color:var(--muted);font-size:.82rem">資料不足</div>';
      const rows = Object.entries(dist)
        .map(([gap,cnt])=>({gap:+gap, cnt, pct:+(cnt/total*100).toFixed(1)}))
        .sort((a,b)=>b.cnt-a.cnt);
      const maxCnt = rows[0].cnt;
      let cumCnt = 0;
      return `<div style="overflow-x:auto"><table>
        <thead><tr><th>名次</th><th>回歸期數</th><th>次數</th><th>佔比</th><th>累積%</th><th>分佈</th></tr></thead>
        <tbody>${rows.slice(0,20).map((r,i)=>{
          cumCnt += r.cnt;
          const barW = Math.round(r.cnt/maxCnt*80);
          const clr = i===0?'#dc2626':i<3?'#d97706':i<8?'#16a34a':'#94a3b8';
          return `<tr>
            <td style="text-align:center;color:var(--muted);font-size:.75rem">${i+1}</td>
            <td style="text-align:center;font-weight:700">間隔 ${r.gap} 期${r.gap===0?' 🔁':''}</td>
            <td style="text-align:center;font-weight:700;color:${clr}">${r.cnt}</td>
            <td style="text-align:center">${r.pct}%</td>
            <td style="text-align:center;color:var(--muted);font-size:.75rem">${(cumCnt/total*100).toFixed(1)}%</td>
            <td><div style="background:${clr};height:8px;border-radius:4px;width:${barW}px;min-width:2px"></div></td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>
      <div style="font-size:.7rem;color:var(--muted);margin-top:6px">共統計 ${total} 次回歸事件，顯示次數最高的前 20 個間隔。注意：間隔分佈遞減是獨立開獎下幾何分佈的自然形狀，見下方平坦度檢驗。</div>`;
    })()}
  </div>

  <div class="card" style="border-left:4px solid #7c3aed">
    <h3>📏 回歸機率平坦度檢驗（賭徒謬誤照妖鏡）</h3>
    <p style="font-size:.78rem;color:var(--muted);margin-bottom:8px">檢驗「沉寂越久越該回歸」：沉寂 g 期的號碼，下一期回歸的實際機率。若各深度都貼近理論值 12.8%（虛線），代表回歸機率與沉寂多久無關。</p>
    ${(()=>{
      const dist=buildReturnDist(rec);
      const expP=5/39*100;
      const rows=[];
      for(let g=0;g<=14;g++){
        const atRisk=Object.entries(dist).reduce((a,[k,c])=>a+((+k>=g)?c:0),0);
        if(atRisk<20) break;
        const h=(dist[g]||0)/atRisk*100;
        const se=Math.sqrt(expP/100*(1-expP/100)/atRisk)*100;
        rows.push({g,atRisk,h,lo:expP-2*se,hi:expP+2*se});
      }
      if(rows.length<4) return '<div style="color:var(--muted);font-size:.82rem">資料不足</div>';
      const outliers=rows.filter(r=>r.h<r.lo||r.h>r.hi).length;
          const maxH=Math.max(...rows.map(r=>r.h),expP)*1.25;
      const barH=v=>Math.max(2,v/maxH*90);
      return `<div style="position:relative;height:112px">
        <div style="position:absolute;left:0;right:0;bottom:${barH(expP)}px;border-top:2px dashed #dc2626;z-index:2"><span style="position:absolute;right:2px;top:-15px;font-size:.62rem;color:#dc2626;font-weight:700">理論 ${expP.toFixed(1)}%</span></div>
        <div style="display:flex;align-items:flex-end;gap:3px;height:112px">
        ${rows.map(r=>{
          const out=r.h<r.lo||r.h>r.hi;
          return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%">
            <span style="font-size:.56rem;color:${out?'#dc2626':'var(--muted)'}">${r.h.toFixed(0)}</span>
            <div style="width:72%;background:${out?'#dc2626':'#7c3aed'};opacity:.8;height:${barH(r.h)}px;border-radius:3px 3px 0 0"></div>
          </div>`;
        }).join('')}
        </div>
      </div>
      <div style="display:flex;gap:3px;margin-top:2px">${rows.map(r=>`<div style="flex:1;text-align:center;font-size:.58rem;color:var(--muted)">${r.g}</div>`).join('')}</div>
      <div style="text-align:center;font-size:.62rem;color:var(--muted);margin-bottom:6px">← 沉寂深度 g（期）→（每根柱下方為 g，柱高＝該深度下一期回歸機率%）</div>
      <div style="font-size:.74rem;padding:7px 10px;background:${outliers<=1?'#f0fdf4':'#fef9c3'};border-radius:6px">
        ${outliers<=1
          ?`✅ <strong>各沉寂深度的回歸機率均貼近理論值</strong>（${rows.length} 個深度僅 ${outliers} 個超出 ±2σ，屬正常波動）——「沉寂越久越該回歸」在本資料中<strong>不成立</strong>，這是每期獨立開獎的直接證據。號碼不會「記得」自己沉寂多久。`
          :`⚠️ ${rows.length} 個深度中有 ${outliers} 個超出 ±2σ（紅柱）。深度越深樣本越少、波動越大，多屬隨機起伏，不代表任何深度比較容易回歸。`}
      </div>`;
    })()}
  </div>

  <div class="card">
    <h3>🏆 歷史兌獎紀錄（${pickLog.length} 筆）</h3>
    ${logHTML}
  </div>

`;
}

// ── RENDER: COMPANION ──────────────────────────────────────
function renderCompanion(el) {
  const pairs = buildPairStat();
  const total = rec.length;
  const randExp = +(total * 2 / (39 * 38 / 2) * C2_ADJ()).toFixed(1);

  function C2_ADJ() { return 5*4/2; } // 每期 C(5,2)=10 個 pair

  // 排行榜
  const topPairs = Object.entries(pairs)
    .map(([k,cnt]) => { const [a,b]=k.split('-').map(Number); return {a,b,cnt,pct:+(cnt/total*100).toFixed(1)}; })
    .sort((x,y)=>y.cnt-x.cnt).slice(0,20);

  // 單號查詢
  const companions = Array.from({length:39},(_,i)=>i+1)
    .filter(n=>n!==compNum)
    .map(n => {
      const k = compNum<n?`${compNum}-${n}`:`${n}-${compNum}`;
      return {n, cnt:pairs[k]||0, pct:+((pairs[k]||0)/total*100).toFixed(1)};
    }).sort((a,b)=>b.cnt-a.cnt);

  const maxCnt = topPairs[0]?.cnt || 1;
  const randLine = +(total*10/(39*38/2)).toFixed(1);

  el.innerHTML = `
  <div class="card">
    <h3>🤝 高頻同伴排行 TOP 20（共 ${total} 期）</h3>
    <div style="font-size:.78rem;color:var(--muted);margin-bottom:10px">同一期同時出現次數最多的號碼對，隨機期望 ≈ ${randLine} 次</div>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>#</th><th>號碼對</th><th style="text-align:center">共現次數</th><th style="text-align:center">頻率</th><th>相對強度</th></tr></thead>
      <tbody>${topPairs.map(({a,b,cnt,pct},i)=>`
        <tr>
          <td style="color:var(--muted);font-size:.75rem">${i+1}</td>
          <td>${ball(a,'ball-sm')} ${ball(b,'ball-sm')}</td>
          <td style="font-weight:700;text-align:center">${cnt}</td>
          <td style="text-align:center;color:var(--muted);font-size:.8rem">${pct}%</td>
          <td style="min-width:80px"><div class="bar-wrap"><div class="bar-fill" style="width:${cnt/maxCnt*100}%;background:var(--primary)"></div></div></td>
        </tr>`).join('')}
      </tbody>
    </table></div>
  </div>

  <div class="card">
    <h3>🔍 單號同伴查詢</h3>
    <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px">
      ${Array.from({length:39},(_,i)=>i+1).map(n=>`
        <span onclick="compNum=${n};renderCompanion(document.getElementById('content'))"
          class="ball ball-sm ${ZC[Z(n)]}"
          style="cursor:pointer;outline:${compNum===n?'2.5px solid #1e293b':'2px solid transparent'};outline-offset:1px">${f2(n)}</span>`).join('')}
    </div>
    <div style="font-size:.85rem;font-weight:700;margin-bottom:8px">
      ${ball(compNum,'ball-sm')} 號碼 ${f2(compNum)} 的同伴頻率（前 10 名）
    </div>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>同伴</th><th style="text-align:center">同期次數</th><th style="text-align:center">頻率</th><th>強度</th></tr></thead>
      <tbody>${companions.slice(0,10).map(({n,cnt,pct})=>`
        <tr>
          <td>${ball(n,'ball-sm')}</td>
          <td style="font-weight:700;text-align:center">${cnt}</td>
          <td style="text-align:center;font-size:.8rem;color:var(--muted)">${pct}%</td>
          <td style="min-width:80px"><div class="bar-wrap"><div class="bar-fill" style="width:${companions[0].cnt?cnt/companions[0].cnt*100:0}%;background:var(--z2)"></div></div></td>
        </tr>`).join('')}
      </tbody>
    </table></div>
    <div style="font-size:.72rem;color:var(--muted);margin-top:8px">隨機期望 ≈ ${randLine} 次（${total} 期 × 理論同現機率）</div>
  </div>`;
}

function applyStats(){
  const raw=document.getElementById('st-paste').value.trim();
  if(!raw) return;
  let cnt=0;
  raw.split('\n').forEach(line=>{
    const p=line.trim().split(/\s+/).map(Number);
    if(p.length>=9){
      const [num,mg,ag,mc,ab,tt,t20,t50,t100]=p;
      if(num>=1&&num<=39){ st[num]={mg,ag,mc,ab,tt,t20,t50,t100}; cnt++; }
    }
  });
  save();
  alert(`已更新 ${cnt} 個號碼`);
  render();
}

function resetAll(){
  if(!confirm('確認重設全部資料回預設值？\n（含開獎紀錄、統計、押注紀錄）')) return;
  rec=JSON.parse(JSON.stringify(BASE_REC)); _dormTbl=null;
  st=JSON.parse(JSON.stringify(BASE_ST));
  retHist={};
  conStat=buildConStat(rec);
  pendingPick=null;
  pickLog=[];
  savePickLog();
  save();
  lastReport=null;
  updateHdr();
  alert(`✅ 已重設完成！\nDraw ${rec[0].p}（${rec[0].dt||""}），共 ${rec.length} 筆。\n押注紀錄已清空。`);
  go('pick');
}

// ── ADD DRAW ───────────────────────────────────────────────
function addDraw(){
  const pv=parseInt(document.getElementById('inp-period').value);
  const ni=[...document.querySelectorAll('.ni')];
  const nums=ni.map(i=>parseInt(i.value)).filter(n=>n>=1&&n<=39);

  if(!pv||pv<10000){ alert('請輸入有效 Draw # (5位數)'); return; }
  if(nums.length!==5){ alert('請輸入5個 01–39 的號碼'); return; }
  if(new Set(nums).size!==5){ alert('號碼不可重複'); return; }
  if(rec[0]&&pv<=rec[0].p){ alert(`Draw # 需大於目前最新（${rec[0].p}）`); return; }

  const sorted=nums.sort((a,b)=>a-b);

  // snapshot pre-update stats for report
  const drawn=sorted.map(n=>({n,abBefore:st[n]?st[n].ab:0,ratio:od(n)}));
  const zd={1:0,2:0,3:0,4:0}; sorted.forEach(n=>{zd[Z(n)]++;});

  // record return history BEFORE updating absent counts
  sorted.forEach(n => {
    const gap = st[n] ? st[n].ab : 0;
    if (!retHist[n]) retHist[n] = [];
    retHist[n].push({period: pv, gap});
  });

  // record consecutive stat: prev draw → current draw
  const repeatNums = [];
  if (rec.length > 0) {
    const prev = rec[0].n;
    prev.forEach(n => {
      if (!conStat[n]) conStat[n] = {total:0, repeats:0, followedBy:{}};
      conStat[n].total++;
      if (sorted.includes(n)) { conStat[n].repeats++; repeatNums.push(n); }
      sorted.forEach(m => { conStat[n].followedBy[m] = (conStat[n].followedBy[m]||0)+1; });
    });
  }

  // update stats
  for(let n=1;n<=39;n++){
    if(!st[n]) continue;
    st[n].ab = sorted.includes(n) ? 0 : st[n].ab+1;
  }

  // check pending pick against this draw result
  if(pendingPick) {
    const hits = {};
    const hitNums = {};
    for(const [k,nums] of Object.entries(pendingPick.strategies)) {
      const matched = nums.filter(n => sorted.includes(n));
      hits[k] = matched.length;
      hitNums[k] = matched;
    }
    pickLog.unshift({period:pv, ...(pendingPick.v?{v:pendingPick.v,algo:pendingPick.algo,seed:pendingPick.seed,hi:pendingPick.hi,...(pendingPick.pools?{pools:pendingPick.pools}:{}),...(pendingPick.readmit?{readmit:pendingPick.readmit}:{})}:{}), strategies:pendingPick.strategies, result:sorted, hits, hitNums, ts:pendingPick.ts});
    pendingPick = null;
    savePickLog();
  }

  // add record
  rec.unshift({p:pv,dt:new Date().toISOString().split('T')[0],n:sorted});
  ANNUAL = buildAnnual(rec);
  save();

  lastReport={period:pv,nums:sorted,drawn,zoneDist:zd,repeatNums,idx:0};

  // clear inputs
  document.getElementById('inp-period').value='';
  ni.forEach(i=>{i.value='';});

  updateHdr();
  go('pick');
}

// ── KEYBOARD SHORTCUTS ─────────────────────────────────────
document.getElementById('inp-period').addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key==='\t') document.querySelectorAll('.ni')[0].focus();
});
document.querySelectorAll('.ni').forEach((inp,i,all)=>{
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter') i<all.length-1 ? all[i+1].focus() : addDraw();
  });
  inp.addEventListener('input',()=>{
    if(inp.value.length>=2&&i<all.length-1) all[i+1].focus();
  });
});

// ── HEADER ─────────────────────────────────────────────────
function updateHdr(){
  const r=rec[0];
  document.getElementById('hdr-info').innerHTML=r
    ?`Draw ${r.p} (${r.dt||''})<br>${r.n.map(f2).join(' ')}`
    :'尚無紀錄';
}

// ── INIT ───────────────────────────────────────────────────
load();
updateHdr();
render();
</script>
